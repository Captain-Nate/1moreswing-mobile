function loadGame(){
  try {
    const s = JSON.parse(localStorage.getItem('oms_save') || '{}');
    if (typeof s.pid  === 'string') playerId = s.pid;
    if (typeof s.coins === 'number') coins = s.coins;
    if (s.owned) for (const k in owned)              // union: keep defaults + anything previously owned
      if (Array.isArray(s.owned[k])) owned[k] = Array.from(new Set([...owned[k], ...s.owned[k]]));
    if (s.equipped) equipped = Object.assign(equipped, s.equipped);
    if (s.themeName && THEMES[s.themeName]) themeName = s.themeName;
    if (typeof s.muted === 'boolean') muted = s.muted;
    if (s.mode === 'daily' || s.mode === 'free') mode = s.mode;
    if (typeof s.name === 'string') playerName = s.name;
  } catch(e){}
  if (!playerId){ playerId = genPid(); saveGame(); }   // first run: mint a persistent player id
}

// trail colour for the equipped style (frac: 0 = oldest .. 1 = newest)
function trailColor(frac, alpha){
  switch(equipped.trail){
    case 'fire':    return `rgba(255,${Math.round(70+130*frac)},40,${alpha})`;
    case 'ice':     return `rgba(${Math.round(120+80*frac)},${Math.round(200+40*frac)},255,${alpha})`;
    case 'neon':    return `rgba(57,255,170,${alpha})`;
    case 'violet':  return `rgba(163,113,247,${alpha})`;
    case 'gold':    return `rgba(255,205,70,${alpha})`;
    case 'rainbow': return `hsla(${(frac*160 + performance.now()/7)%360},90%,62%,${alpha})`;
    default:        return `rgba(${TH().rgb},${alpha})`;
  }
}
function orbColors(){
  if (equipped.orb === 'rainbow'){
    const h = (performance.now()/6) % 360;
    return [`hsl(${h},85%,60%)`, `hsl(${h},95%,82%)`];
  }
  return ORB_COLORS[equipped.orb] || [TH().accent, TH().glow];
}

/* ============================ DAILY (Phase 4) ============================ */
// Seed the course generator with today's date so everyone gets the same run.
const DAILY_EPOCH = Date.UTC(2026, 5, 11);     // Day 1 = 2026-06-11 (UTC)
function todayInfo(){
  const n = new Date();
  const utcMid = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate());
  const day  = Math.floor((utcMid - DAILY_EPOCH) / 86400000) + 1;
  const seed = n.getUTCFullYear()*10000 + (n.getUTCMonth()+1)*100 + n.getUTCDate();
  return { day, seed };
}
// mulberry32: tiny deterministic PRNG (same seed -> same sequence -> same course)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;     // current run's random source (set per run)
let mode = 'daily';        // 'daily' | 'free'
let dayNumber = 1;
let finishX = null;        // x of the daily finish line (null = endless / Free Play)
let runTime = 0, finishTime = 0, finishBonus = 0;   // active play time + finish time-bonus
let lbOpen = false, playerName = '', playerId = '', lastScore = 0, submittedRun = false;
let usedRevive = false, adShowing = false;

// ---- game state ----
let p, prevP, state, anchor, ropeLen, anchors, platforms, genX, lastY, cameraX, dist, cleared, trail, lastReleased;
let total, pending, mult, lastGrabbedX, anchorGenCount, popups;

const fmt = n => Math.round(n).toLocaleString();
const fmtTime = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function popup(wx, wy, text, color, big){ popups.push({ x:wx, y:wy, text, color, big:!!big, age:0 }); }

/* ============================ JUICE (Phase 3) ============================ */
// camera (focus-x, zoom, screen-shake) + particles + time control + SFX
let camX = 0, zoom = 1, shakeMag = 0, shakeX = 0, shakeY = 0;
let freezeFrames = 0, slowmoFrames = 0, particles = [], flightLowY = 0;

function addShake(m){ shakeMag = Math.min(34, Math.max(shakeMag, m)); }
function hitPause(f){ freezeFrames = Math.max(freezeFrames, f); }
function slowmo(f){ slowmoFrames = Math.max(slowmoFrames, f); }

function burst(wx, wy, n, color, spd){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = spd*(0.35+Math.random()*0.9);
    particles.push({ x:wx, y:wy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color });
  }
}
function updateParticles(){
  for (let i=particles.length-1;i>=0;i--){
    const q = particles[i];
    q.x += q.vx*DT; q.y += q.vy*DT; q.vy += 700*DT; q.vx *= 0.985;
    q.life -= DT*1.7;
    if (q.life <= 0) particles.splice(i,1);
  }
}
function updateCamera(){
  zoom = 1;                                           // zoom disabled for motion comfort
  camX += (p.x - camX) * 0.16;                        // smooth horizontal follow (slight lag)
  shakeMag *= 0.86;
  shakeX = (Math.random()*2-1) * shakeMag;
  shakeY = (Math.random()*2-1) * shakeMag;
}

// ---- synthesized SFX (no audio files) ----
let actx = null, muted = false;
function audioCtx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq, dur, type, vol, slideTo){
  if (muted) return; const a = audioCtx(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t0=a.currentTime;
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur);
}
function noiseSweep(dur, vol, fStart, fEnd){
  if (muted) return; const a = audioCtx(); if(!a) return;
  const t0=a.currentTime, len=Math.max(1,Math.floor(a.sampleRate*dur));
  const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const n=a.createBufferSource(); n.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(fStart,t0); f.frequency.linearRampToValueAtTime(fEnd,t0+dur);
  const g=a.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  n.connect(f).connect(g).connect(a.destination); n.start(t0); n.stop(t0+dur);
}
function sfxGrab(){ const f = 480 + Math.min(mult,14)*55; tone(f, 0.09, 'square', 0.10, f*1.7); }   // thwip — pitch climbs with greed
function sfxRelease(speed){ noiseSweep(0.18, Math.min(0.22, 0.05 + speed/5000), 900, 180); }          // whoosh
function sfxBank(){ tone(620,0.12,'triangle',0.16); setTimeout(()=>tone(820,0.14,'triangle',0.16),80); setTimeout(()=>tone(1240,0.20,'triangle',0.14),170); }
function sfxSkip(n){ for (let i=0;i<=n;i++) setTimeout(()=>tone(520+i*150, 0.10, 'square', 0.12), i*50); }
function sfxDie(){ tone(220, 0.5, 'sawtooth', 0.18, 55); }

// next anchor height: random WALK from the previous one, so neighbours stay
// close enough in height to always be reachable in a chain.
function nextY(){
  const a = H * K.ANCHOR_Y_MIN, b = H * K.ANCHOR_Y_MAX;
  let y = lastY + (rng()*2-1) * K.ANCHOR_VSTEP;
  y = Math.max(a, Math.min(b, y));
  lastY = y;
  return y;
}

function ensureWorld(){
  // generate ahead of the camera, cull what's well behind it
  const limit = cameraX + W + 500;
  while (genX < limit){
    // daily routes are finite: after DAILY_LENGTH anchors, drop a finish pad and stop
    if (mode === 'daily' && anchorGenCount >= K.DAILY_LENGTH){
      if (finishX === null){
        genX += K.MAX_ROPE + 70;                 // gap beyond the last swing's reach
        finishX = genX;                          // finish is just the dashed line — cross it mid-air to complete
      }
      break;
    }
    genX += K.ANCHOR_SPACING + (rng()*2-1) * K.SPACING_VAR;
    anchorGenCount++;
    if (anchorGenCount % K.PLATFORM_EVERY === 0){
      // a safe BANK platform, with a relaunch anchor floating above it
      const py = H * K.PLATFORM_Y;
      platforms.push({ x: genX - K.PLATFORM_W/2, y: py, w: K.PLATFORM_W });
      const ay = Math.max(H * K.ANCHOR_Y_MIN, py - K.LAUNCH_ANCHOR_UP);
      anchors.push({ x: genX, y: ay, got:false, launch:true });
      lastY = ay;
    } else {
      anchors.push({ x: genX, y: nextY(), got:false });
    }
  }
  while (anchors.length  && anchors[0].x  < cameraX - 200) anchors.shift();
  while (platforms.length && platforms[0].x + platforms[0].w < cameraX - 200) platforms.shift();
}

function newRun(){
  runCount++;
  // seed the course: daily = same for everyone today, free = fresh each run
  const ti = todayInfo(); dayNumber = ti.day;
  rng = mode === 'daily' ? mulberry32(ti.seed) : mulberry32((Math.random()*1e9)|0);
  const ob = document.getElementById('overBtns'); if (ob) ob.classList.remove('show');
  hideGameOverAd();
  lastScore = 0; submittedRun = false; usedRevive = false;

  anchors = []; platforms = []; cleared = 0; trail = []; popups = [];
  lastReleased = null; anchorGenCount = 0; finishX = null; runTime = 0;
  total = 0; pending = 0; mult = 1;

  // first anchor sits right where the player starts, so we begin already swinging
  const first = { x: 320, y: H * 0.26, got:true };
  anchors.push(first);
  cleared = 1;
  lastY = first.y;
  genX = first.x;
  lastGrabbedX = first.x;

  // begin in an infinite full-circle spin around the first anchor; tap to launch out of it
  ropeLen = K.START_ROPE;
  anchor  = first;
  spinAngle = 0;                                  // 0 = hanging straight below the anchor
  p     = { x: first.x, y: first.y + ropeLen };
  prevP = { x: p.x, y: p.y };
  state = 'spin';

  cameraX = p.x - W * K.CAM_X_ANCHOR;
  dist = Math.floor(p.x / 10);
  ensureWorld();

  // reset juice
  camX = p.x; zoom = 1; shakeMag = shakeX = shakeY = 0;
  freezeFrames = slowmoFrames = 0; particles = []; flightLowY = p.y;
}

// pick the best anchor a press would grab: in range, prefer ahead, then nearest
function pickTarget(){
  let bestA = null, bestScore = Infinity;
  for (const a of anchors){
    if (a === lastReleased) continue;          // can't instantly re-grab the peg you just left
    const dx = a.x - p.x, dy = a.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > K.GRAPPLE_RANGE) continue;
    // bias toward anchors ahead of the player so chains move forward
    const aheadPenalty = a.x < p.x - 40 ? 600 : 0;
    const score = d + aheadPenalty;
    if (score < bestScore){ bestScore = score; bestA = a; }
  }
  return bestA;
}

function press(){
  const h = document.getElementById('hint'); if (h) h.classList.add('hide');   // hide tutorial hint after first touch
  if (paused || shopOpen || lbOpen) return;
  const ac = audioCtx(); if (ac && ac.state === 'suspended') ac.resume();   // unlock audio on gesture
  if (state === 'dead' || state === 'finished'){ newRun(); consumeRelease = true; return; }
  if (state !== 'flying' && state !== 'landed') return;
  const clutch = flightLowY > H*K.DEATH_FRAC - K.NEARMISS;   // dipped scary-low this flight = a save
  const t = pickTarget();
  if (!t) return; // whiff — no anchor in reach
  anchor = t;
  ropeLen = Math.min(Math.hypot(p.x-t.x, p.y-t.y), K.MAX_ROPE);

  let skipped = 0;
  if (!t.got){
    // how many fresh dots did we fly clean past to reach this one?
    for (const a of anchors)
      if (a !== t && !a.got && a.x > lastGrabbedX + 1 && a.x < t.x - 1) skipped++;

    t.got = true; cleared++;
    mult += K.MULT_PER_ANCHOR + skipped * K.SKIP_MULT_BONUS;
    const gained = Math.round((K.ANCHOR_POINTS + skipped * K.SKIP_POINTS) * mult);
    pending += gained;

    if (skipped > 0) popup(t.x, t.y - 26, `SKIP ×${skipped}!  +${fmt(gained)}`, TH().accent, true);
    else             popup(t.x, t.y - 22, `+${fmt(gained)}`, '#8b949e');
  }
  lastGrabbedX = t.x;
  state = 'swinging';

  // --- juice ---
  const [oc] = orbColors();
  sfxGrab();
  burst(t.x, t.y, 7 + skipped*4, oc, 90 + skipped*40);
  addShake(2.4 + skipped*2.5);
  if (skipped > 0){ sfxSkip(skipped); if (skipped >= 2) hitPause(4); }
  if (clutch){ slowmo(22); addShake(6); popup(t.x, t.y - 46, 'CLUTCH!', '#ffd95e', true); }
}

function bank(){
  if (pending > 0){
    total += pending;
    coins += Math.round(pending * K.COIN_RATE);   // lifetime spendable wallet (persists across runs)
    saveGame();
    popup(p.x, p.y - 34, `BANKED +${fmt(pending)}`, '#3fb950', true);
    sfxBank(); burst(p.x, p.y, 26, '#3fb950', 220); addShake(5); hitPause(3);
  }
  pending = 0; mult = 1;
}

function release(){
  if (consumeRelease){ consumeRelease = false; return; }   // ignore the same tap that restarted the run
  if (state === 'spin'){
    // tap to launch out of the spin — reuse the normal release feel, but never fling backward
    let vx = (p.x - prevP.x) * K.RELEASE_BOOST;
    let vy = (p.y - prevP.y) * K.RELEASE_BOOST;
    if (vx < 0) vx = -vx;
    prevP.x = p.x - vx; prevP.y = p.y - vy;
    lastReleased = anchor; anchor = null; state = 'flying'; flightLowY = p.y;
    const launch = Math.hypot(vx, vy) / DT; sfxRelease(launch);
    if (launch > K.BIG_LAUNCH){ addShake(Math.min(16, launch/90)); hitPause(3); }
    return;
  }
  if (state !== 'swinging') return;
  // Verlet velocity carries automatically; nudge it for a snappy launch
  const vx = (p.x - prevP.x) * K.RELEASE_BOOST;
  const vy = (p.y - prevP.y) * K.RELEASE_BOOST;
  prevP.x = p.x - vx; prevP.y = p.y - vy;
  lastReleased = anchor;        // locked out until we fly clear of its range
  anchor = null; state = 'flying';
  flightLowY = p.y;             // start tracking how low this flight dips

  // --- juice ---
  const launch = Math.hypot(vx, vy) / DT;
  sfxRelease(launch);
  if (launch > K.BIG_LAUNCH){ addShake(Math.min(16, launch/90)); hitPause(3); }
}

function physics(){
  updateParticles();   // run inside the sim step so hit-pause / slow-mo affect them too
  if (state === 'spin' && anchor){             // infinite first-hook spin (kinematic, pre-launch)
    spinAngle += (K.START_VX / K.START_ROPE) * DT;  // tangential speed ≈ START_VX so launch keeps current feel
    prevP.x = p.x; prevP.y = p.y;                    // trail prevP so release() reads the right velocity
    p.x = anchor.x + Math.sin(spinAngle) * ropeLen;
    p.y = anchor.y + Math.cos(spinAngle) * ropeLen;
    trail.push({ x:p.x, y:p.y }); if (trail.length > 22) trail.shift();
    return;
  }
  if (state !== 'flying' && state !== 'swinging') return;
  runTime += DT;       // active play time only (excludes pause / menus / landed)
  const drag = state === 'swinging' ? K.SWING_DRAG : K.AIR_DRAG;

  // Verlet integration (momentum is implicit in p - prevP)
  const nx = p.x + (p.x - prevP.x) * drag;
  const ny = p.y + (p.y - prevP.y) * drag + K.GRAVITY * DT * DT;
  prevP.x = p.x; prevP.y = p.y;
  p.x = nx; p.y = ny;

  // rope constraint — also imparts tangential velocity for free
  if (state === 'swinging' && anchor){
    // --- active pump: holding builds the swing, strongest at the bottom of the arc ---
    let rx = p.x-anchor.x, ry = p.y-anchor.y;
    const rl = Math.hypot(rx, ry) || 1; rx/=rl; ry/=rl;     // radial unit (anchor -> player)
    const tx = -ry, ty = rx;                                // tangent unit
    const vx = (p.x-prevP.x)/DT, vy = (p.y-prevP.y)/DT;
    const tang = vx*tx + vy*ty;                             // signed speed along the arc
    const weight = Math.max(0, ry);                         // ~1 at the bottom, 0 at the sides
    if (Math.abs(tang) < K.MAX_SWING_SPEED){
      const dir = Math.abs(tang) > 30 ? Math.sign(tang)    // amplify the way you're already going
                                      : (tx > 0 ? 1 : -1); // dead hang: kick toward forward progress
      const add = K.SWING_PUMP * weight * dir * DT * DT;
      p.x += tx * add; p.y += ty * add;
    }
    for (let i=0;i<2;i++){
      const dx = p.x - anchor.x, dy = p.y - anchor.y;
      const d = Math.hypot(dx, dy) || 1;
      const diff = (d - ropeLen) / d;
      p.x -= dx * diff; p.y -= dy * diff;
    }
  }

  // land on a safe platform while falling -> BANK the pending score
  if (state === 'flying' && p.y >= prevP.y){
    for (const pl of platforms){
      const landY = pl.y - 11;
      if (p.x > pl.x && p.x < pl.x + pl.w && prevP.y <= landY && p.y >= landY){
        p.y = landY; prevP.x = p.x; prevP.y = p.y;       // come to rest on the ledge
        state = 'landed'; lastReleased = null; lastGrabbedX = p.x;
        bank();
        break;
      }
    }
  }

  // once we've flown clear of the just-released peg, it's grabbable again
  if (lastReleased && Math.hypot(p.x-lastReleased.x, p.y-lastReleased.y) > K.GRAPPLE_RANGE)
    lastReleased = null;

  // bookkeeping
  if (state === 'flying') flightLowY = Math.max(flightLowY, p.y);   // deepest dip this flight
  cameraX = p.x - W * K.CAM_X_ANCHOR;
  dist = Math.max(dist, Math.floor(p.x / 10));
  ensureWorld();

  trail.push({ x:p.x, y:p.y }); if (trail.length > 22) trail.shift();

  if (mode === 'daily' && finishX !== null && p.x >= finishX){ finish(); return; }
  if (p.y > H * K.DEATH_FRAC){ die(); }
}

// show the end-of-run buttons (shared by death + daily finish)
function showOverButtons(){
  const ob = document.getElementById('overBtns'); if (ob) ob.classList.add('show');
  const lo = document.getElementById('lbOpenBtn'); if (lo) lo.style.display = mode === 'daily' ? '' : 'none';
  const rv = document.getElementById('reviveBtn');
  if (rv){
    // revive: Free Play only, on death, once per run, and only when a rewarded provider is available
    rv.style.display = (rewardedAvailable() && mode === 'free' && !usedRevive && state === 'dead') ? '' : 'none';
    rv.textContent = '▶ Continue · Ad'; rv.disabled = false;
  }
  showGameOverAd();
}

function die(){
  best = Math.max(best, total);   // best = highest BANKED score
  state = 'dead';
  sfxDie(); addShake(16); burst(p.x, p.y, 30, '#f85149', 260);
  lastScore = total; submittedRun = false;
  showOverButtons();
}

// reached the end of a daily route — complete the run, banking what's left
function finish(){
  bank();                         // lock in remaining pending as a completion reward
  finishTime = runTime;
  finishBonus = Math.round(Math.max(0, K.TIME_BONUS_CAP_S - runTime) * K.TIME_BONUS_PER_S);
  total += finishBonus;           // faster finish = bigger time bonus
  best = Math.max(best, total);
  state = 'finished';
  lastScore = total; submittedRun = false;
  sfxBank(); addShake(8); burst(p.x, p.y, 34, '#ffd95e', 240);
  showOverButtons();
}

// resume a dead run from the nearest anchor, keeping score/multiplier (Free Play only)
function revive(){
  let best = null, bd = Infinity;
  for (const a of anchors){ const d = Math.abs(a.x - p.x); if (d < bd){ bd = d; best = a; } }
  if (!best){ best = { x: p.x, y: H * 0.30, got: true }; anchors.push(best); }
  anchor = best; ropeLen = K.START_ROPE;
  p.x = best.x; p.y = best.y + ropeLen;
  prevP.x = p.x - 220 * DT; prevP.y = p.y;     // gentle forward nudge
  state = 'swinging'; lastReleased = null; flightLowY = p.y;
  usedRevive = true;
  const ob = document.getElementById('overBtns'); if (ob) ob.classList.remove('show');
  hideGameOverAd();
  addShake(6); burst(p.x, p.y, 18, TH().accent, 150);
}

// ---------- input ----------
let spaceDown = false, pointerActive = false;
let spinAngle = 0, consumeRelease = false;   // first-hook spin state + swallow the tap that restarts a run
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); pointerActive = true; press(); });
window.addEventListener('pointerup', ()=>{ if (pointerActive){ pointerActive = false; release(); } });
window.addEventListener('keydown', e=>{
  if (e.code === 'Space'){ e.preventDefault(); if(!spaceDown){ spaceDown=true; press(); } }
  else if (e.key === 'd' || e.key === 'D') debug = !debug;
  else if (e.key === 'r' || e.key === 'R') newRun();
  else if (e.key === 'p' || e.key === 'P') togglePause();
  else if (e.key === 'l' || e.key === 'L'){ lbOpen ? closeLeaderboard() : openLeaderboard(); }
  else if (e.key === 'Escape'){ if (shopOpen) closeShop(); else if (lbOpen) closeLeaderboard(); }
});
window.addEventListener('keyup', e=>{ if (e.code==='Space'){ spaceDown=false; release(); } });

// ---------- UI buttons ----------
const colorBtn = document.getElementById('colorBtn');
const pauseBtn = document.getElementById('pauseBtn');
const muteBtn  = document.getElementById('muteBtn');
const modeBtn  = document.getElementById('modeBtn');
const shareBtn = document.getElementById('shareBtn');
function syncUI(){
  document.documentElement.style.setProperty('--accent', TH().accent);
  colorBtn.querySelector('.dot').style.color = TH().accent;     // drives the glow + fill
  colorBtn.querySelector('.dot').style.background = TH().accent;
  pauseBtn.innerHTML = paused ? '&#9654;' : '&#10074;&#10074;'; // ▶ / ❚❚
  pauseBtn.title = paused ? 'Resume' : 'Pause';
  muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;';        // 🔇 / 🔊
  muteBtn.title = muted ? 'Unmute' : 'Mute';
  modeBtn.innerHTML = mode === 'daily' ? '&#128197; Daily' : '&#8734; Free'; // 📅 Daily / ∞ Free
  modeBtn.title = mode === 'daily' ? 'Daily challenge — tap for Free Play' : 'Free Play — tap for Daily';
  // favicon follows the current colour scheme
  const fav = document.getElementById('favicon');
  if (fav){
    const c = TH().accent.replace('#', '%23');
    fav.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='${c}' opacity='0.25'/><circle cx='32' cy='32' r='21' fill='${c}'/></svg>`;
  }
}
function togglePause(){ paused = !paused; syncUI(); }
colorBtn.addEventListener('click', ()=>{
  const list = owned.theme || ['blue','red'];
  themeName = list[(list.indexOf(themeName) + 1) % list.length];
  syncUI(); saveGame();

function renderShop(){
  document.getElementById('shopCoins').textContent = fmt(coins);
  let html = '';
  for (const [cat,label] of [['theme','THEMES'],['trail','TRAILS'],['orb','ORBS']]){
    html += `<div class="cat">${label}</div>`;

      const isEq    = cat === 'theme' ? themeName === it.id : equipped[cat] === it.id;
      let btn;

      else if (isOwned)  btn = `<button data-act="equip" data-cat="${cat}" data-id="${it.id}">Equip</button>`;
      else               btn = `<button class="buy" data-act="buy" data-cat="${cat}" data-id="${it.id}" ${coins<it.cost?'disabled':''}>Buy &middot; ${fmt(it.cost)}</button>`;

  const it = COSMETICS[cat].find(x => x.id === id);

function lbSign(day, score){ const s=`${day}:${score}:oms_v1`; let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function tagOf(pid){ let h=5381; const s=String(pid); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return String(h % 10000); }  // matches server
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// profanity filter (must match the server's isClean in functions/api/scores.js)
const BANNED = [
  'fuck','shit','bitch','cunt','asshole','bastard','slut','whore','piss','dick',
  'pussy','dildo','jizz','wank','twat','bollock','boner','semen','ejaculat',
  'masturbat','blowjob','handjob','cumshot','cocksuck','cockhead','motherfuck',
  'bullshit','dumbass','jackass','dickhead','nigger','nigga','faggot','retard',
  'rapist','molest','pedo','paedo','nazi','kike','spic','chink','coon','wetback',
  'tranny','dyke','porn','hentai','fellatio','goatse','scrotum'
];
function deleet(s){
  return String(s).toLowerCase()
    .replace(/[\s._\-]+/g,'')
    .replace(/ph/g,'f')
    .replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a')
    .replace(/5/g,'s').replace(/7/g,'t').replace(/8/g,'b').replace(/9/g,'g')
    .replace(/\$/g,'s').replace(/@/g,'a').replace(/\+/g,'t').replace(/!/g,'i')
    .replace(/v/g,'u')
    .replace(/[^a-z]/g,'');
}
function isClean(name){
  const n = deleet(name), c = n.replace(/(.)\1+/g,'$1');
  return !BANNED.some(w => n.includes(w) || c.includes(w));
}

function drawBackground(){
  if (TH().bg === 'space'){
    ctx.fillStyle = '#05070d'; ctx.fillRect(0,0,W,H);
    let neb = ctx.createRadialGradient(W*0.72,H*0.28,0, W*0.72,H*0.28,H*0.85);
    neb.addColorStop(0,'rgba(52,211,153,0.10)'); neb.addColorStop(1,'rgba(52,211,153,0)');

    ctx.fillStyle = neb; ctx.fillRect(0,0,W,H);
    if (!stars) makeStars();
    const t = performance.now()/1000;
    ctx.fillStyle = '#dfe8ff';
    for (const s of stars){
      const px = ((s.x*W - cameraX*s.par) % W + W) % W;   // parallax wrap
      ctx.globalAlpha = 0.35 + 0.5*Math.max(0, Math.sin(t*2 + s.ph));

    g.addColorStop(0.6,'#ff6ad5'); g.addColorStop(0.74,'#ff8c6b'); g.addColorStop(1,'#190a2e');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // banded retro sun
    const sunY = H*0.58, sunR = H*0.17;

    ctx.beginPath(); ctx.arc(W*0.5, sunY, sunR, 0, Math.PI*2); ctx.clip();
    const sg = ctx.createLinearGradient(0, sunY-sunR, 0, sunY+sunR);
    sg.addColorStop(0,'#fff07a'); sg.addColorStop(1,'#ff5dae');

    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(!stars) makeStars();
    const t=performance.now()/1000; ctx.fillStyle='#ffd6f5';
    for(const s of stars){ if(s.y>0.5) continue; const px=((s.x*W - cameraX*s.par)%W+W)%W;
      ctx.globalAlpha=0.35+0.4*Math.max(0,Math.sin(t*2+s.ph)); ctx.beginPath(); ctx.arc(px,s.y*H*0.9,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    const horizon=H*0.62;
    ctx.strokeStyle='#ffcf3a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(W*0.5,horizon,H*0.15,Math.PI,0); ctx.stroke();
    ctx.strokeStyle='rgba(255,45,149,0.5)'; ctx.lineWidth=1;
    for(let i=1;i<=12;i++){ const tt=i/12, y=horizon+(H-horizon)*tt*tt; ctx.globalAlpha=0.5*(1-tt)+0.1; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.globalAlpha=1;
    const vp=W*0.5, off=(cameraX*0.3)%60;
    for(let i=-16;i<=16;i++){ const x=vp+i*60-off; ctx.beginPath(); ctx.moveTo(vp,horizon); ctx.lineTo(vp+(x-vp)*4,H); ctx.stroke(); }
  } else if (TH().bg === 'biopunk'){
    // bioluminescent organic
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#04120c'); g.addColorStop(1,'#08160f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    let r=ctx.createRadialGradient(W*0.3,H*0.6,0,W*0.3,H*0.6,H*0.7);
    r.addColorStop(0,'rgba(61,255,160,0.12)'); r.addColorStop(1,'rgba(61,255,160,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    r=ctx.createRadialGradient(W*0.75,H*0.3,0,W*0.75,H*0.3,H*0.6);
    r.addColorStop(0,'rgba(0,200,180,0.10)'); r.addColorStop(1,'rgba(0,200,180,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    if(!stars) makeStars();
    const t=performance.now()/1000;
    for(const s of stars){
      const px=((s.x*W - cameraX*s.par - t*8*s.par)%W+W)%W, py=s.y*H+Math.sin(t*0.5+s.ph)*8;
      ctx.fillStyle='#5dffb0'; ctx.globalAlpha=0.12+0.16*Math.max(0,Math.sin(t+s.ph));
      ctx.beginPath(); ctx.arc(px,py,s.r*3,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=0.4+0.4*Math.max(0,Math.sin(t+s.ph));
      ctx.beginPath(); ctx.arc(px,py,s.r*1.2,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  } else if (TH().bg === 'kawaii'){
    // soft dreamy pastel with clouds
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2b2750'); g.addColorStop(1,'#4a2f55');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    let r=ctx.createRadialGradient(W*0.3,H*0.35,0,W*0.3,H*0.35,H*0.7);
    r.addColorStop(0,'rgba(169,199,255,0.12)'); r.addColorStop(1,'rgba(169,199,255,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    r=ctx.createRadialGradient(W*0.7,H*0.6,0,W*0.7,H*0.6,H*0.6);
    r.addColorStop(0,'rgba(255,180,220,0.12)'); r.addColorStop(1,'rgba(255,180,220,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    const t=performance.now()/1000;
    ctx.fillStyle='rgba(255,225,245,0.09)';
    for(let i=0;i<5;i++){
      const cx=((i*240 - cameraX*0.15 - t*6)%(W+220)+(W+220))%(W+220)-110, cy=H*(0.18+0.14*i)+Math.sin(t*0.4+i)*6;
      ctx.beginPath(); ctx.ellipse(cx,cy,46,20,0,0,Math.PI*2); ctx.ellipse(cx+28,cy+4,32,16,0,0,Math.PI*2); ctx.ellipse(cx-28,cy+4,30,15,0,0,Math.PI*2); ctx.fill();
    }
    if(!stars) makeStars();
    for(const s of stars){ if(s.x>0.6) continue; const px=((s.x*W - cameraX*s.par)%W+W)%W;
      ctx.globalAlpha=0.3+0.4*Math.max(0,Math.sin(t*1.5+s.ph)); ctx.fillStyle=s.ph>3?'#ffc2e2':'#bcd3ff';
      ctx.beginPath(); ctx.arc(px,s.y*H,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  } else if (TH().bg === 'solar'){
    // hopeful eco-future
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#16321f'); g.addColorStop(0.6,'#1d3a22'); g.addColorStop(1,'#0e2417');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    let r=ctx.createRadialGradient(W*0.6,H*0.2,0,W*0.6,H*0.2,H*0.85);
    r.addColorStop(0,'rgba(255,213,107,0.16)'); r.addColorStop(1,'rgba(255,213,107,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    r=ctx.createRadialGradient(W*0.2,H*0.7,0,W*0.2,H*0.7,H*0.6);
    r.addColorStop(0,'rgba(120,230,140,0.10)'); r.addColorStop(1,'rgba(120,230,140,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    if(!stars) makeStars();
    const t=performance.now()/1000; ctx.fillStyle='#ffe9a8';
    for(const s of stars){ const px=((s.x*W - cameraX*s.par - t*5*s.par)%W+W)%W, py=s.y*H+Math.sin(t*0.4+s.ph)*10;
      ctx.globalAlpha=0.22+0.4*Math.max(0,Math.sin(t+s.ph)); ctx.beginPath(); ctx.arc(px,py,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(8,28,17,0.9)';
    const base=H*0.93, lt=90, loff=((cameraX*0.25)%lt+lt)%lt;
    for(let i=-1;i<W/lt+2;i++){ const lx=i*lt-loff; ctx.beginPath(); ctx.moveTo(lx,H); ctx.quadraticCurveTo(lx+lt*0.3, base-26, lx+lt*0.5, base); ctx.quadraticCurveTo(lx+lt*0.7, base-26, lx+lt, H); ctx.fill(); }
  } else if (TH().bg === 'twitch'){
    // stream purple with drifting chat-emote spam
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#160d28'); g.addColorStop(1,'#0e0a18');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    let r=ctx.createRadialGradient(W*0.3,H*0.3,0,W*0.3,H*0.3,H*0.7);
    r.addColorStop(0,'rgba(145,70,255,0.16)'); r.addColorStop(1,'rgba(145,70,255,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    r=ctx.createRadialGradient(W*0.75,H*0.65,0,W*0.75,H*0.65,H*0.6);
    r.addColorStop(0,'rgba(188,120,255,0.10)'); r.addColorStop(1,'rgba(188,120,255,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    if (!emotes) makeEmotes();
    const t = performance.now()/1000;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for (const e of emotes){
      const yy = ((e.y - t*e.spd*0.05) % 1 + 1) % 1;       // float upward, wrap
      const px = e.x*W + Math.sin(t*0.5 + e.ph)*14;
      let a = 0.5;
      if (yy < 0.15) a *= yy/0.15;                         // fade out near top
      if (yy > 0.9)  a *= (1-yy)/0.1;                       // fade in near bottom
      ctx.globalAlpha = a; ctx.font = `${e.size}px sans-serif`;
      ctx.fillText(e.ch, px, yy*H);
    }
    ctx.globalAlpha=1; ctx.textBaseline='alphabetic';
  } else {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0d1117'); g.addColorStop(1,'#161b22');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
}

function draw(){
  drawBackground();

  const target = (state==='flying' || state==='landed') ? pickTarget() : null;
  const deathY = H*K.DEATH_FRAC;
  const wLeft  = camX - (W*K.CAM_X_ANCHOR)/zoom - 60;
  const wRight = camX + (W*(1-K.CAM_X_ANCHOR))/zoom + 60;

  // ===== WORLD (camera zoom + screen shake) =====
  ctx.save();
  ctx.translate(W*K.CAM_X_ANCHOR + shakeX, H*0.5 + shakeY);
  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -H*0.5);

  // death zone
  ctx.fillStyle = 'rgba(248,81,73,0.09)';
  ctx.fillRect(wLeft, deathY, wRight-wLeft, H);
  ctx.strokeStyle = 'rgba(248,81,73,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(wLeft,deathY); ctx.lineTo(wRight,deathY); ctx.stroke();

  // safe bank platforms (and the gold finish pad)
  for (const pl of platforms){
    if (pl.x > wRight || pl.x + pl.w < wLeft) continue;
    if (pl.finish){
      ctx.fillStyle = '#e3b341'; ctx.fillRect(pl.x, pl.y, pl.w, 12);
      ctx.fillStyle = 'rgba(255,217,94,0.4)'; ctx.fillRect(pl.x, pl.y, pl.w, 4);
    } else {
      ctx.fillStyle = '#238636'; ctx.fillRect(pl.x, pl.y, pl.w, 12);
      ctx.fillStyle = 'rgba(63,185,80,0.35)'; ctx.fillRect(pl.x, pl.y, pl.w, 4);
      ctx.fillStyle = 'rgba(63,185,80,0.85)'; ctx.font = '700 11px ui-sans-serif, system-ui';
      ctx.textAlign = 'center'; ctx.fillText('BANK', pl.x + pl.w/2, pl.y - 7);
    }
  }

  // daily finish line
  if (finishX !== null && finishX > wLeft && finishX < wRight){
    ctx.strokeStyle = '#ffd95e'; ctx.lineWidth = 3; ctx.setLineDash([9,7]);
    ctx.beginPath(); ctx.moveTo(finishX, 46); ctx.lineTo(finishX, deathY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffd95e'; ctx.font = '800 15px ui-sans-serif, system-ui'; ctx.textAlign = 'center';
    ctx.fillText('FINISH', finishX, 38);
  }

  // anchors
  for (const a of anchors){
    if (a.x < wLeft || a.x > wRight) continue;
    const isTarget = a === target;
    ctx.beginPath(); ctx.arc(a.x, a.y, isTarget?9:6, 0, Math.PI*2);
    ctx.fillStyle = a===anchor ? TH().accent
                  : a.got      ? '#3b4655'
                  : a.launch   ? '#3fb950'   // relaunch peg above a platform
                  : '#7d8590';
    ctx.fill();
    if (isTarget){
      ctx.beginPath(); ctx.arc(a.x, a.y, 15, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${TH().rgb},0.7)`; ctx.lineWidth = 2; ctx.stroke();
    }
    if (debug){
      ctx.beginPath(); ctx.arc(a.x, a.y, K.GRAPPLE_RANGE, 0, Math.PI*2);
      ctx.strokeStyle='rgba(125,133,144,0.06)'; ctx.lineWidth=1; ctx.stroke();
    }
  }

  // target preview line
  if (target){
    ctx.setLineDash([4,6]); ctx.strokeStyle=`rgba(${TH().rgb},0.5)`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(target.x,target.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // rope
  if ((state==='swinging' || state==='spin') && anchor){
    ctx.strokeStyle='#8b949e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(anchor.x,anchor.y); ctx.lineTo(p.x,p.y); ctx.stroke();
  }

  // trail (equipped style)
  for (let i=0;i<trail.length;i++){
    const t = trail[i], al = i/trail.length;
    ctx.beginPath(); ctx.arc(t.x, t.y, 2 + al*7, 0, Math.PI*2);
    ctx.fillStyle = trailColor(al, al*0.30); ctx.fill();
  }

  // particles (grab / bank / death bursts)
  for (const q of particles){
    ctx.globalAlpha = Math.max(0, q.life);
    ctx.beginPath(); ctx.arc(q.x, q.y, 1 + q.life*4, 0, Math.PI*2);
    ctx.fillStyle = q.color; ctx.fill();
  }
  ctx.globalAlpha = 1;

  // player (equipped orb skin, with glow)
  if (state!=='dead'){
    const [oc, ic] = orbColors();
    ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.arc(p.x, p.y, 17, 0, Math.PI*2);
    ctx.fillStyle = oc; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI*2); ctx.fillStyle = oc; ctx.fill();
    if (equipped.orb === 'smiley'){
      ctx.fillStyle = '#1a1206';
      ctx.beginPath(); ctx.arc(p.x-3.6, p.y-3, 1.7, 0, Math.PI*2); ctx.fill();   // eyes
      ctx.beginPath(); ctx.arc(p.x+3.6, p.y-3, 1.7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#1a1206'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';   // smile
      ctx.beginPath(); ctx.arc(p.x, p.y+1, 5, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    } else if (equipped.orb === 'eye'){
      const vx = p.x - prevP.x, vy = p.y - prevP.y, m = Math.hypot(vx, vy) || 1;
      const ox = (vx/m)*3.4, oy = (vy/m)*3.4;            // pupil glances toward motion
      ctx.fillStyle = '#2f80ed'; ctx.beginPath(); ctx.arc(p.x+ox, p.y+oy, 4.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0b0e14'; ctx.beginPath(); ctx.arc(p.x+ox, p.y+oy, 2.3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x+ox-1.2, p.y+oy-1.2, 1.0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fillStyle = ic; ctx.fill();
    }
  }

  // debug velocity vector (world)
  if (debug){
    const vx = (p.x-prevP.x)/DT, vy = (p.y-prevP.y)/DT;
    ctx.strokeStyle='#f0883e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+vx*0.12, p.y+vy*0.12); ctx.stroke();
  }

  // floating score popups (world space, so they ride the camera)
  for (let i = popups.length - 1; i >= 0; i--){
    const f = popups[i];
    if (!paused){ f.age++; f.y -= 0.7; }
    const al = Math.max(0, 1 - f.age/95);
    if (al <= 0){ popups.splice(i,1); continue; }
    ctx.globalAlpha = al; ctx.textAlign = 'center'; ctx.fillStyle = f.color;
    ctx.font = `${f.big ? 800 : 600} ${f.big ? 20 : 14}px ui-sans-serif, system-ui`;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  // ===== end WORLD =====

  // escalating "heat" — edge glow intensifies as the multiplier climbs
  const heat = Math.min((mult-1)/10, 1);
  if (heat > 0.02){
    const rg = ctx.createRadialGradient(W/2,H/2, H*0.30, W/2,H/2, H*0.85);
    rg.addColorStop(0, 'rgba(0,0,0,0)');
    rg.addColorStop(1, `rgba(${TH().rgb},${0.22*heat})`);
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  }

  // HUD — banked score (top-left). Compact on phones, fuller on desktop.
  const small = W < 600;
  ctx.save(); ctx.translate(SAFE_LEFT, SAFE_TOP);  // keep clear of notch / Dynamic Island
  ctx.textAlign = 'left';
  if (small){
    ctx.fillStyle = mode==='daily' ? TH().accent : '#8b949e';
    ctx.font = '800 10px ui-sans-serif, system-ui'; ctx.letterSpacing = '1px';
    ctx.fillText(mode==='daily' ? `DAY ${dayNumber} · ${fmtTime(runTime)}` : 'FREE PLAY', 14, 21);
    ctx.letterSpacing = '0px';
    ctx.fillStyle = '#e6edf3'; ctx.font = '800 23px ui-sans-serif, system-ui';
    ctx.fillText(fmt(total), 13, 46);
    let yy = 65;
    if (pending > 0){
      ctx.fillStyle = TH().accent; ctx.font = '600 13px ui-sans-serif, system-ui';
      ctx.fillText(`+${fmt(pending)} at risk`, 14, yy); yy += 17;
    }
    ctx.fillStyle = '#ffd95e'; ctx.font = '700 11px ui-sans-serif, system-ui';
    ctx.fillText(`★ ${fmt(best)}`, 14, yy);
  } else {
    ctx.fillStyle = mode==='daily' ? TH().accent : '#8b949e';
    ctx.font = '800 12px ui-sans-serif, system-ui'; ctx.letterSpacing = '1px';
    ctx.fillText(mode==='daily' ? `DAILY · DAY ${dayNumber} · ${fmtTime(runTime)}` : 'FREE PLAY', 21, 28);
    ctx.letterSpacing = '0px';
    ctx.fillStyle = '#8b949e'; ctx.font = '11px ui-sans-serif, system-ui';
    ctx.fillText('BANKED', 22, 52);
    ctx.fillStyle = '#e6edf3'; ctx.font = '800 30px ui-sans-serif, system-ui';
    ctx.fillText(fmt(total), 20, 80);
    if (pending > 0){
      ctx.fillStyle = TH().accent; ctx.font = '600 15px ui-sans-serif, system-ui';
      ctx.fillText(`+${fmt(pending)} at risk`, 21, 102);
    }
    ctx.fillStyle = '#6e7681'; ctx.font = '12px ui-sans-serif, system-ui';
    ctx.fillText(`${dist} m  ·  run ${runCount}`, 21, 122);
    ctx.fillStyle = '#ffd95e'; ctx.font = '800 15px ui-sans-serif, system-ui';
    ctx.fillText(`★ BEST  ${fmt(best)}`, 21, 144);
    ctx.fillStyle = '#c9a227'; ctx.font = '600 13px ui-sans-serif, system-ui';
    ctx.fillText(`${fmt(coins)} coins`, 21, 166);
  }
  ctx.restore();

  // daily progress bar (thin, top edge) — shows how far through the route you are
  if (mode === 'daily' && finishX !== null && state !== 'finished'){
    const prog = Math.max(0, Math.min(1, (p.x - 320) / (finishX - 320)));
    ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(0, SAFE_TOP, W, 3);
    ctx.fillStyle = TH().accent; ctx.fillRect(0, SAFE_TOP, W * prog, 3);
  }

  // multiplier — huge & pulsing, glowing hotter with greed
  if (state!=='dead' && state!=='finished'){
    const big = mult > 1;
    const pulse = big ? 1 + 0.05*Math.sin(performance.now()/90) + heat*0.12 : 1;
    ctx.save();
    // phones: float it low, below the bank-pad band (PLATFORM_Y 0.64); desktop: keep it up top under the HUD
    const multY = small ? H * 0.78 : SAFE_TOP + 100;
    ctx.translate(W/2, multY); ctx.scale(pulse, pulse);
    ctx.textAlign='center';
    ctx.font = `800 ${24 + Math.min((mult-1)*9, 36)}px ui-sans-serif, system-ui`;
    ctx.fillStyle = big ? TH().accent : '#6e7681';
    if (big){ ctx.shadowColor = TH().accent; ctx.shadowBlur = 8 + 22*heat; }
    ctx.fillText(`×${mult.toFixed(1)}`, 0, 0);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  // debug overlay (text; the velocity vector is drawn in the world layer)
  if (debug){
    const vx = (p.x-prevP.x)/DT, vy = (p.y-prevP.y)/DT;
    ctx.fillStyle='#f0883e'; ctx.font='12px monospace'; ctx.textAlign='left';
    ctx.fillText(`|v|=${Math.hypot(vx,vy)|0}  zoom=${zoom.toFixed(2)}  state=${state}  parts=${particles.length}`, 20, H-20);
  }

  // death overlay
  if (state==='dead'){
    ctx.fillStyle='rgba(13,17,23,0.80)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#e6edf3'; ctx.font='700 34px ui-sans-serif, system-ui';
    ctx.fillText('Run over', W/2, H/2 - 100);
    ctx.fillStyle='#8b949e'; ctx.font='600 13px ui-sans-serif, system-ui'; ctx.letterSpacing = '2px';
    ctx.fillText('SCORE', W/2, H/2 - 52);
    ctx.letterSpacing = '0px';
    ctx.fillStyle='#e6edf3'; ctx.font='800 52px ui-sans-serif, system-ui';
    ctx.fillText(fmt(total), W/2, H/2 + 8);
    if (pending > 0){
      ctx.fillStyle='#f85149'; ctx.font='600 17px ui-sans-serif, system-ui';
      ctx.fillText(`${fmt(pending)} unbanked — should've banked!`, W/2, H/2 + 48);
    }
    ctx.fillStyle=TH().accent; ctx.font='600 16px ui-sans-serif, system-ui';
    ctx.fillText('press / tap / Space to swing again', W/2, H/2 + 94);
  }

  // daily finish overlay
  if (state==='finished'){
    ctx.fillStyle='rgba(13,17,23,0.82)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#3fb950'; ctx.font='800 22px ui-sans-serif, system-ui'; ctx.letterSpacing='1px';
    ctx.fillText('DAILY COMPLETE', W/2, H/2 - 100); ctx.letterSpacing='0px';
    ctx.fillStyle='#8b949e'; ctx.font='600 13px ui-sans-serif, system-ui'; ctx.letterSpacing='2px';
    ctx.fillText(`DAY ${dayNumber} · SCORE`, W/2, H/2 - 52); ctx.letterSpacing='0px';
    ctx.fillStyle='#e6edf3'; ctx.font='800 52px ui-sans-serif, system-ui';
    ctx.fillText(fmt(total), W/2, H/2 + 8);
    ctx.fillStyle='#8b949e'; ctx.font='600 14px ui-sans-serif, system-ui';
    ctx.fillText(`Finished in ${fmtTime(finishTime)}   ·   +${fmt(finishBonus)} time bonus`, W/2, H/2 + 44);
    ctx.fillStyle=TH().accent; ctx.font='600 16px ui-sans-serif, system-ui';
    ctx.fillText('press / tap / Space to replay', W/2, H/2 + 94);
  }

  // pause overlay
  if (paused && state!=='dead' && state!=='finished'){
    ctx.fillStyle='rgba(13,17,23,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#e6edf3';
    ctx.font='700 38px ui-sans-serif, system-ui';
    ctx.fillText('Paused', W/2, H/2 - 6);
    ctx.fillStyle='#8b949e'; ctx.font='15px ui-sans-serif, system-ui';
    ctx.fillText('Tap the ▶ button to resume', W/2, H/2 + 26);
  }
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now){
  let ft = (now-last)/1000; last = now;
  if (!paused && !shopOpen && !lbOpen){
    let timeScale = 1;
    if      (freezeFrames > 0){ freezeFrames--; timeScale = 0;   }  // hit-pause: full freeze
    else if (slowmoFrames > 0){ slowmoFrames--; timeScale = 0.4; }  // clutch slow-mo
    ft = Math.min(ft, 0.25); acc += ft * timeScale;
    let steps = 0;
    while (acc >= DT && steps < 5){ physics(); acc -= DT; steps++; }
    updateCamera();
  } else {
    acc = 0;   // don't fast-forward simulation on resume
  }
  draw();
  requestAnimationFrame(frame);
}
loadGame();
newRun();
syncUI();
requestAnimationFrame(frame);
</script>
