const REMINDER_ID = 4041;          // fixed id so re-scheduling replaces, never stacks

function localNotifs(){ return window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.LocalNotifications; }
// Schedule a repeating daily nudge at REMINDER_HOUR. If they've already done today's
// daily (or `skipToday`), anchor the first fire to tomorrow so we don't nag the same day.
async function scheduleDailyReminder(skipToday){
  const LN = localNotifs(); if (!LN) return;
  try {
    let perm = await LN.checkPermissions();
    if (perm.display !== 'granted') perm = await LN.requestPermissions();
    if (perm.display !== 'granted') return;
    const at = new Date(); at.setHours(REMINDER_HOUR, 0, 0, 0);
    if (skipToday || at <= new Date()) at.setDate(at.getDate() + 1);
    await LN.cancel({ notifications: [{ id: REMINDER_ID }] });
    await LN.schedule({ notifications: [{
      id: REMINDER_ID,
      title: '1 More Swing',
      body: "Today's daily run is ready — keep your streak going! 🪝",
      schedule: { at, repeats: true, every: 'day' },
    }]});
  } catch(e){}
}

// (the first prompt happens after the player finishes a daily, a natural moment).

    const perm = await LN.checkPermissions();

// Seed the course generator with today's date so everyone gets the same run.
const DAILY_EPOCH = Date.UTC(2026, 5, 11);     // Day 1 = 2026-06-11 (UTC)
function todayInfo(){
  const n = new Date();
  const utcMid = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate());
  const day  = Math.floor((utcMid - DAILY_EPOCH) / 86400000) + 1;
  const seed = n.getUTCFullYear()*10000 + (n.getUTCMonth()+1)*100 + n.getUTCDate();
  return { day, seed };
}
// mulberry32: tiny deterministic PRNG (same seed -> same sequence -> same course)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;     // current run's random source (set per run)
let mode = 'daily';        // 'daily' | 'free'
let dayNumber = 1;
let lastDailyDone = 0;     // day number of the most recent completed daily (drives the reminder skip-today)
let finishX = null;        // x of the daily finish line (null = endless / Free Play)
let runTime = 0, finishTime = 0, finishBonus = 0;   // active play time + finish time-bonus
let runRoute = [], runCoinsEarned = 0;              // per-run stats for the share card (runRoute[i] = grabbed route anchor i+1)
let lbOpen = false, playerName = '', playerId = '', lastScore = 0, submittedRun = false, editingName = false;
let myWins = 0;   // player's all-time wins (from the leaderboard) — drives the Minimalist theme unlock
let titleOpen = true;      // start on the title screen; pauses the game loop until Play
let usedRevive = false, adShowing = false;

// ---- game state ----
let p, prevP, state, anchor, ropeLen, anchors, platforms, genX, lastY, cameraX, dist, cleared, trail, lastReleased;
let total, pending, mult, lastGrabbedX, anchorGenCount, popups;

const fmt = n => Math.round(n).toLocaleString();
const fmtTime = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function popup(wx, wy, text, color, big){ popups.push({ x:wx, y:wy, text, color, big:!!big, age:0 }); }

/* ============================ JUICE (Phase 3) ============================ */
// camera (focus-x, zoom, screen-shake) + particles + time control + SFX
let camX = 0, zoom = 1, shakeMag = 0, shakeX = 0, shakeY = 0;
let freezeFrames = 0, slowmoFrames = 0, particles = [], flightLowY = 0;

function addShake(m){ shakeMag = Math.min(34, Math.max(shakeMag, m)); }
function hitPause(f){ freezeFrames = Math.max(freezeFrames, f); }
function slowmo(f){ slowmoFrames = Math.max(slowmoFrames, f); }

function burst(wx, wy, n, color, spd){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = spd*(0.35+Math.random()*0.9);
    particles.push({ x:wx, y:wy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color });
  }
}
function updateParticles(){
  for (let i=particles.length-1;i>=0;i--){
    const q = particles[i];
    q.x += q.vx*DT; q.y += q.vy*DT; q.vy += 700*DT; q.vx *= 0.985;
    q.life -= DT*1.7;
    if (q.life <= 0) particles.splice(i,1);
  }
}
function updateCamera(){
  zoom = 1;                                           // zoom disabled for motion comfort
  camX += (p.x - camX) * 0.16;                        // smooth horizontal follow (slight lag)
  shakeMag *= 0.86;
  shakeX = (Math.random()*2-1) * shakeMag;
  shakeY = (Math.random()*2-1) * shakeMag;
}

// ---- synthesized SFX (no audio files) ----
let actx = null, muted = false;
function audioCtx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq, dur, type, vol, slideTo){
  if (muted) return; const a = audioCtx(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t0=a.currentTime;
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur);
}
function noiseSweep(dur, vol, fStart, fEnd){
  if (muted) return; const a = audioCtx(); if(!a) return;
  const t0=a.currentTime, len=Math.max(1,Math.floor(a.sampleRate*dur));
  const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const n=a.createBufferSource(); n.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(fStart,t0); f.frequency.linearRampToValueAtTime(fEnd,t0+dur);
  const g=a.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  n.connect(f).connect(g).connect(a.destination); n.start(t0); n.stop(t0+dur);
}
function sfxGrab(){ const f = 480 + Math.min(mult,14)*55; tone(f, 0.09, 'square', 0.10, f*1.7); }   // thwip — pitch climbs with greed
function sfxRelease(speed){ noiseSweep(0.18, Math.min(0.22, 0.05 + speed/5000), 900, 180); }          // whoosh
function sfxBank(){ tone(620,0.12,'triangle',0.16); setTimeout(()=>tone(820,0.14,'triangle',0.16),80); setTimeout(()=>tone(1240,0.20,'triangle',0.14),170); }
function sfxSkip(n){ for (let i=0;i<=n;i++) setTimeout(()=>tone(520+i*150, 0.10, 'square', 0.12), i*50); }
function sfxDie(){ tone(220, 0.5, 'sawtooth', 0.18, 55); }
function sfxPurchase(){ [523,659,784,1047,1319].forEach((f,i)=> setTimeout(()=> tone(f, 0.22, 'triangle', 0.16), i*65)); }   // C-E-G-C-E fanfare

// next anchor height: random WALK from the previous one, so neighbours stay
// close enough in height to always be reachable in a chain.
function nextY(){
  const a = H * K.ANCHOR_Y_MIN, b = H * K.ANCHOR_Y_MAX;
  let y = lastY + (rng()*2-1) * K.ANCHOR_VSTEP;
  y = Math.max(a, Math.min(b, y));
  lastY = y;
  return y;
}

function ensureWorld(){
  // generate ahead of the camera, cull what's well behind it
  const limit = cameraX + W + 500;
  while (genX < limit){
    // daily routes are finite: after DAILY_LENGTH anchors, drop a finish pad and stop
    if (mode === 'daily' && anchorGenCount >= K.DAILY_LENGTH){
      if (finishX === null){
        genX += K.MAX_ROPE + 70;                 // gap beyond the last swing's reach
        finishX = genX;                          // finish is just the dashed line — cross it mid-air to complete
      }
      break;
    }
    genX += K.ANCHOR_SPACING + (rng()*2-1) * K.SPACING_VAR;
    anchorGenCount++;
    if (anchorGenCount % K.PLATFORM_EVERY === 0){
      // a safe BANK platform, with a relaunch anchor floating above it
      const py = H * K.PLATFORM_Y;
      platforms.push({ x: genX - K.PLATFORM_W/2, y: py, w: K.PLATFORM_W });
      const ay = Math.max(H * K.ANCHOR_Y_MIN, py - K.LAUNCH_ANCHOR_UP);
      anchors.push({ x: genX, y: ay, got:false, launch:true, idx: anchorGenCount });
      lastY = ay;
    } else {
      anchors.push({ x: genX, y: nextY(), got:false, idx: anchorGenCount });
    }
  }
  // Anchors & platforms are kept persistent (they no longer vanish once you pass them).
  // The draw loop already skips off-screen items and pickTarget runs over a small list
  // even on long runs, so the memory/CPU cost is negligible in practice.
}

function newRun(){
  runCount++;
  // seed the course: daily = same for everyone today, free = fresh each run
  const ti = todayInfo(); dayNumber = ti.day;
  rng = mode === 'daily' ? mulberry32(ti.seed) : mulberry32((Math.random()*1e9)|0);
  const ob = document.getElementById('overBtns'); if (ob) ob.classList.remove('show');
  hideGameOverAd();
  lastScore = 0; submittedRun = false; usedRevive = false;

  anchors = []; platforms = []; cleared = 0; trail = []; popups = [];
  lastReleased = null; anchorGenCount = 0; finishX = null; runTime = 0;
  total = 0; pending = 0; mult = 1;
  runRoute = new Array(K.DAILY_LENGTH).fill(false); runCoinsEarned = 0;
  document.getElementById('shareCard').classList.remove('show');

  // first anchor sits right where the player starts, so we begin already swinging
  const first = { x: 320, y: H * 0.26, got:true };
  anchors.push(first);
  cleared = 1;
  lastY = first.y;
  genX = first.x;
  lastGrabbedX = first.x;

  // hang straight below the first anchor, moving forward = bottom of the arc
  // (auto-pumps and loops perpetually — the ready state you launch from)
  ropeLen = K.START_ROPE;
  p     = { x: first.x, y: first.y + ropeLen };
  prevP = { x: p.x - K.START_VX * DT, y: p.y };
  anchor = first;
  state  = 'swinging';

  cameraX = p.x - W * K.CAM_X_ANCHOR;
  dist = Math.floor(p.x / 10);
  ensureWorld();

  // reset juice
  camX = p.x; zoom = 1; shakeMag = shakeX = shakeY = 0;
  freezeFrames = slowmoFrames = 0; particles = []; flightLowY = p.y;
  syncUI();   // revert the top-right button from Home (⌂) back to Pause
}

// guarantee a relaunch peg above a platform so you can never get stranded on it
// (the world is generated forward-only; a peg can be culled while its pad survives,
//  so swinging back onto an old pad could leave nothing to grab)
function ensureLaunchAnchor(pl){
  const ax = pl.x + pl.w/2;
  const ay = Math.max(H * K.ANCHOR_Y_MIN, pl.y - K.LAUNCH_ANCHOR_UP);
  for (const a of anchors)
    if (Math.abs(a.x - ax) < 8 && Math.abs(a.y - ay) < 8) return;   // already there
  const peg = { x: ax, y: ay, got:false, launch:true };
  let i = anchors.length;                                            // keep anchors x-sorted (cull reads from front)
  while (i > 0 && anchors[i-1].x > ax) i--;
  anchors.splice(i, 0, peg);
}

// pick the best anchor a press would grab: in range, prefer ahead, then nearest
function pickTarget(){
  let bestA = null, bestScore = Infinity;
  for (const a of anchors){
    if (a === lastReleased) continue;          // can't instantly re-grab the peg you just left
    const dx = a.x - p.x, dy = a.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > K.GRAPPLE_RANGE) continue;
    // bias toward anchors ahead of the player so chains move forward
    const aheadPenalty = a.x < p.x - 40 ? 600 : 0;
    const score = d + aheadPenalty;
    if (score < bestScore){ bestScore = score; bestA = a; }
  }
  return bestA;
}

function press(){
  const h = document.getElementById('hint'); if (h) h.classList.add('hide');   // hide tutorial hint after first touch
  if (paused || shopOpen || lbOpen || titleOpen || infoOpen || previewing) return;
  const ac = audioCtx(); if (ac && ac.state === 'suspended') ac.resume();   // unlock audio on gesture
  if (state === 'dead' || state === 'finished'){ newRun(); consumeRelease = true; return; }
  if (state !== 'flying' && state !== 'landed') return;
  const clutch = flightLowY > H*K.DEATH_FRAC - K.NEARMISS;   // dipped scary-low this flight = a save
  const t = pickTarget();
  if (!t) return; // whiff — no anchor in reach
  anchor = t;
  ropeLen = Math.min(Math.hypot(p.x-t.x, p.y-t.y), K.MAX_ROPE);

  let skipped = 0;
  if (!t.got){
    // how many fresh dots did we fly clean past to reach this one?
    for (const a of anchors)
      if (a !== t && !a.got && a.x > lastGrabbedX + 1 && a.x < t.x - 1) skipped++;

    t.got = true; cleared++;
    if (mode === 'daily' && t.idx >= 1 && t.idx <= runRoute.length) runRoute[t.idx - 1] = true;
    mult += K.MULT_PER_ANCHOR + skipped * K.SKIP_MULT_BONUS;
    const gained = Math.round((K.ANCHOR_POINTS + skipped * K.SKIP_POINTS) * mult);
    pending += gained;

    if (skipped > 0) popup(t.x, t.y - 26, `SKIP ×${skipped}!  +${fmt(gained)}`, TH().accent, true);
    else             popup(t.x, t.y - 22, `+${fmt(gained)}`, '#8b949e');
  }
  lastGrabbedX = t.x;
  state = 'swinging';

  // --- juice ---
  const [oc] = orbColors();
  sfxGrab();
  burst(t.x, t.y, 7 + skipped*4, oc, 90 + skipped*40);
  addShake(2.4 + skipped*2.5);
  if (skipped > 0){ sfxSkip(skipped); if (skipped >= 2) hitPause(4); }
  if (clutch){ slowmo(22); addShake(6); popup(t.x, t.y - 46, 'CLUTCH!', '#ffd95e', true); }
}

function bank(){
  if (pending > 0){
    total += pending;
    const earned = Math.round(pending * K.COIN_RATE);
    coins += earned;   // lifetime spendable wallet (persists across runs)
    runCoinsEarned += earned;
    saveGame();
    popup(p.x, p.y - 34, `BANKED +${fmt(pending)}`, '#3fb950', true);
    sfxBank(); burst(p.x, p.y, 26, '#3fb950', 220); addShake(5); hitPause(3);
  }
  pending = 0; mult = 1;
}

function release(){
  if (titleOpen || previewing) return;
  if (consumeRelease){ consumeRelease = false; return; }   // ignore the same tap that restarted the run
  if (state !== 'swinging') return;
  // Verlet velocity carries automatically; nudge it for a snappy launch
  const vx = (p.x - prevP.x) * K.RELEASE_BOOST;
  const vy = (p.y - prevP.y) * K.RELEASE_BOOST;
  prevP.x = p.x - vx; prevP.y = p.y - vy;
  lastReleased = anchor;        // locked out until we fly clear of its range
  anchor = null; state = 'flying';
  flightLowY = p.y;             // start tracking how low this flight dips

  // --- juice ---
  const launch = Math.hypot(vx, vy) / DT;
  sfxRelease(launch);
  if (launch > K.BIG_LAUNCH){ addShake(Math.min(16, launch/90)); hitPause(3); }
}

function physics(){
  updateParticles();   // run inside the sim step so hit-pause / slow-mo affect them too
  if (state !== 'flying' && state !== 'swinging') return;
  runTime += DT;       // active play time only (excludes pause / menus / landed)
  const drag = state === 'swinging' ? K.SWING_DRAG : K.AIR_DRAG;

  // Verlet integration (momentum is implicit in p - prevP)
  const nx = p.x + (p.x - prevP.x) * drag;
  const ny = p.y + (p.y - prevP.y) * drag + K.GRAVITY * DT * DT;
  prevP.x = p.x; prevP.y = p.y;
  p.x = nx; p.y = ny;

  // rope constraint — also imparts tangential velocity for free
  if (state === 'swinging' && anchor){
    // --- active pump: holding builds the swing, strongest at the bottom of the arc ---
    let rx = p.x-anchor.x, ry = p.y-anchor.y;
    const rl = Math.hypot(rx, ry) || 1; rx/=rl; ry/=rl;     // radial unit (anchor -> player)
    const tx = -ry, ty = rx;                                // tangent unit
    const vx = (p.x-prevP.x)/DT, vy = (p.y-prevP.y)/DT;
    const tang = vx*tx + vy*ty;                             // signed speed along the arc
    const weight = Math.max(0, ry);                         // ~1 at the bottom, 0 at the sides
    if (Math.abs(tang) < K.MAX_SWING_SPEED){
      const dir = Math.abs(tang) > 30 ? Math.sign(tang)    // amplify the way you're already going
                                      : (tx > 0 ? 1 : -1); // dead hang: kick toward forward progress
      const add = K.SWING_PUMP * weight * dir * DT * DT;
      p.x += tx * add; p.y += ty * add;
    }
    for (let i=0;i<2;i++){
      const dx = p.x - anchor.x, dy = p.y - anchor.y;
      const d = Math.hypot(dx, dy) || 1;
      const diff = (d - ropeLen) / d;
      p.x -= dx * diff; p.y -= dy * diff;
    }
  }

  // land on a safe platform while falling -> BANK the pending score
  if (state === 'flying' && p.y >= prevP.y){
    for (const pl of platforms){
      const landY = pl.y - 11;
      if (p.x > pl.x && p.x < pl.x + pl.w && prevP.y <= landY && p.y >= landY){
        p.y = landY; prevP.x = p.x; prevP.y = p.y;       // come to rest on the ledge
        state = 'landed'; lastReleased = null; lastGrabbedX = p.x;
        ensureLaunchAnchor(pl);   // never get stranded — make sure there's a peg above this pad
        bank();
        break;
      }
    }
  }

  // once we've flown clear of the just-released peg, it's grabbable again
  if (lastReleased && Math.hypot(p.x-lastReleased.x, p.y-lastReleased.y) > K.GRAPPLE_RANGE)
    lastReleased = null;

  // bookkeeping
  if (state === 'flying') flightLowY = Math.max(flightLowY, p.y);   // deepest dip this flight
  cameraX = p.x - W * K.CAM_X_ANCHOR;
  dist = Math.max(dist, Math.floor(p.x / 10));
  ensureWorld();

  trail.push({ x:p.x, y:p.y }); if (trail.length > 22) trail.shift();

  if (mode === 'daily' && finishX !== null && p.x >= finishX){ finish(); return; }
  if (p.y > H * K.DEATH_FRAC){ die(); }
}

// show the end-of-run buttons (shared by death + daily finish)
function showOverButtons(){
  const ob = document.getElementById('overBtns'); if (ob) ob.classList.add('show');
  const lo = document.getElementById('lbOpenBtn'); if (lo) lo.style.display = mode === 'daily' ? '' : 'none';
  const rv = document.getElementById('reviveBtn');
  if (rv){
    // revive: Free Play only, on death, once per run, and only when a rewarded provider is available
    rv.style.display = (rewardedAvailable() && mode === 'free' && !usedRevive && state === 'dead') ? '' : 'none';
    rv.textContent = '▶ Continue · Ad'; rv.disabled = false;
  }
  showGameOverAd();
}

function die(){
  best = Math.max(best, total);   // best = highest BANKED score
  state = 'dead';
  sfxDie(); addShake(16); burst(p.x, p.y, 30, '#f85149', 260);
  lastScore = total; submittedRun = false;
  showOverButtons();
  syncUI();   // swap the top-right Pause button to a Home (⌂) button
}

// reached the end of a daily route — complete the run, banking what's left
function finish(){
  bank();                         // lock in remaining pending as a completion reward
  finishTime = runTime;
  finishBonus = Math.round(Math.max(0, K.TIME_BONUS_CAP_S - runTime) * K.TIME_BONUS_PER_S);
  total += finishBonus;           // faster finish = bigger time bonus
  best = Math.max(best, total);
  state = 'finished';
  lastScore = total; submittedRun = false;
  if (mode === 'daily'){ lastDailyDone = dayNumber; saveGame();
    scheduleDailyReminder(true); }   // they just played today → first reminder is tomorrow (prompts for permission the first time)
  sfxBank(); addShake(8); burst(p.x, p.y, 34, '#ffd95e', 240);
  showOverButtons();
  syncUI();   // swap the top-right Pause button to a Home (⌂) button
  setTimeout(showShareCard, 1400);
}

// resume a dead run from the nearest anchor, keeping score/multiplier (Free Play only)
function revive(){
  let best = null, bd = Infinity;
  for (const a of anchors){ const d = Math.abs(a.x - p.x); if (d < bd){ bd = d; best = a; } }
  if (!best){ best = { x: p.x, y: H * 0.30, got: true }; anchors.push(best); }
  anchor = best; ropeLen = K.START_ROPE;
  p.x = best.x; p.y = best.y + ropeLen;
  prevP.x = p.x - 220 * DT; prevP.y = p.y;     // gentle forward nudge
  state = 'swinging'; lastReleased = null; flightLowY = p.y;
  usedRevive = true;
  const ob = document.getElementById('overBtns'); if (ob) ob.classList.remove('show');
  hideGameOverAd();
  addShake(6); burst(p.x, p.y, 18, TH().accent, 150);
}

// ---------- input ----------
let spaceDown = false, pointerActive = false;
let consumeRelease = false;   // swallow the tap that restarts a run so it doesn't also launch
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); pointerActive = true; press(); });
// Kill the iOS long-press magnifier/loupe during a hold on the playfield. user-select:none
// alone doesn't always stop it; preventing the touch gesture does (pointer events still fire).
cv.addEventListener('touchstart', e=>{ e.preventDefault(); }, { passive:false });
cv.addEventListener('touchmove',  e=>{ e.preventDefault(); }, { passive:false });
window.addEventListener('pointerup', ()=>{ if (pointerActive){ pointerActive = false; release(); } });
window.addEventListener('keydown', e=>{
  if (e.code === 'Space'){ e.preventDefault(); if(!spaceDown){ spaceDown=true; press(); } }
  else if (e.key === 'd' || e.key === 'D') debug = !debug;
  else if (e.key === 'r' || e.key === 'R') newRun();
  else if (e.key === 'p' || e.key === 'P') togglePause();
  else if (e.key === 'l' || e.key === 'L'){ lbOpen ? closeLeaderboard() : openLeaderboard(); }
  else if (e.key === 'Escape'){ if (infoOpen) closeInfo(); else if (previewing){ endPreview(false); openShop(); } else if (shopOpen) closeShop(); else if (lbOpen) closeLeaderboard(); }
});
window.addEventListener('keyup', e=>{ if (e.code==='Space'){ spaceDown=false; release(); } });

// ---------- UI buttons ----------
const colorBtn = document.getElementById('colorBtn');
const pauseBtn = document.getElementById('pauseBtn');
const muteBtn  = document.getElementById('muteBtn');
const modeBtn  = document.getElementById('modeBtn');
const shareBtn = document.getElementById('shareBtn');
// crisp house icon for the run-over "Home" button (the ⌂ glyph is tiny/unclear)
const HOME_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>';
function syncUI(){
  document.documentElement.style.setProperty('--accent', TH().accent);
  colorBtn.querySelector('.dot').style.color = TH().accent;     // drives the glow + fill
  colorBtn.querySelector('.dot').style.background = TH().accent;
  muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;';        // 🔇 / 🔊
  muteBtn.title = muted ? 'Unmute' : 'Mute';
  modeBtn.innerHTML = mode === 'daily' ? '&#128197; Daily' : '&#8734; Free'; // 📅 Daily / ∞ Free
  modeBtn.title = mode === 'daily' ? 'Daily challenge — tap for Free Play' : 'Free Play — tap for Daily';
  // favicon follows the current colour scheme
  const fav = document.getElementById('favicon');
  if (fav){
    const c = TH().accent.replace('#', '%23');
    fav.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='${c}' opacity='0.25'/><circle cx='32' cy='32' r='21' fill='${c}'/></svg>`;
  }
  // screens: title overlay, top-right button mode, and the pause "Menu" button
  const over = (state === 'dead' || state === 'finished');
  const ts = document.getElementById('titleScreen'); if (ts) ts.classList.toggle('show', titleOpen);
  const pausedMenu = paused && !titleOpen && !over;
  const tt = document.getElementById('toTitleBtn');  if (tt) tt.classList.toggle('show', pausedMenu);
  const rb = document.getElementById('resumeBtn');   if (rb) rb.classList.toggle('show', pausedMenu);
  if (titleOpen){   // going Home from the run-over screen: clear the game-over buttons/ad that sit above the title
    const ob = document.getElementById('overBtns');   if (ob) ob.classList.remove('show');
    const ga = document.getElementById('gameoverAd');  if (ga) ga.classList.remove('show');
  }
  const hint = document.getElementById('hint'); if (hint) hint.style.display = titleOpen ? 'none' : '';  // hint would show through the now-transparent title overlay
  const ot = document.getElementById('title'); if (ot) ot.style.display = titleOpen ? 'none' : '';  // the title screen has its own big title — avoid a 2nd one up top (e.g. landscape, where the phone media query doesn't hide it)
  // top-right button: hidden on the title screen; a Home (⌂) button on the run-over screen
  // (nothing to pause there, and it avoids overlapping the "Tap to swing again" text); else Pause/Resume
  pauseBtn.style.display = titleOpen ? 'none' : '';
  if (over){ pauseBtn.innerHTML = HOME_ICON; pauseBtn.title = 'Menu'; }
  else     { pauseBtn.innerHTML = paused ? '&#9654;' : '&#10074;&#10074;'; pauseBtn.title = paused ? 'Resume' : 'Pause'; }
}

function shareText(){

}
async function doShare(){
  const text = shareText();
  try { if (navigator.share){ await navigator.share({ text }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  try {
    await navigator.clipboard.writeText(text);
    const old = shareBtn.textContent; shareBtn.textContent = 'Copied! ✓';
    setTimeout(()=>{ shareBtn.textContent = old; }, 1600);
  } catch(e){}
}

function showShareCard(){
  const card = document.getElementById('shareCard');
  if (!card) return;

  document.getElementById('sc-day').textContent = `Day ${dayNumber}`;
  document.getElementById('sc-score').textContent = fmt(total);

  // One dot per route anchor (10 cols × 4 rows). Each lights up if you grabbed
  // that anchor; the final dot is the finish line — gold if you completed the route.
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#58a6ff';
  const finished = state === 'finished';
  const grid = document.getElementById('sc-grid');
  grid.innerHTML = '';
  for (let i = 0; i < runRoute.length; i++){
    const dot = document.createElement('span');
    const isLast = i === runRoute.length - 1;
    dot.style.background = (isLast && finished) ? '#ffd95e'   // finish line reached
      : runRoute[i] ? accent                                  // grabbed this anchor
      : '#21262d';                                            // not reached
    grid.appendChild(dot);
  }

  // Stats line
  const hitCount = runRoute.filter(Boolean).length;
  document.getElementById('sc-stats').innerHTML =
    `<b style="color:#e6edf3">${hitCount}/${runRoute.length}</b> anchors used&nbsp;&nbsp;·&nbsp;&nbsp;` +
    `⏱ <b style="color:#e6edf3">${fmtTime(finishTime)}</b>&nbsp;&nbsp;·&nbsp;&nbsp;` +
    `<span class="ci">C</span><b style="color:#ffd95e">+${runCoinsEarned}</b>`;

  card.classList.add('show');
}

function swatchStyle(cat, id){
  if (cat === 'theme'){
    if (id === 'space')     return 'radial-gradient(circle at 32% 30%, #34d399, #05070d 78%)';
    if (id === 'vapor')     return 'linear-gradient(135deg,#2de2e6,#ff71ce 70%)';
    if (id === 'unicorn')   return 'conic-gradient(#ff8fd6,#c9a7ff,#a0e9ff,#ffd6a0,#ff8fd6)';
    if (id === 'cyber')     return 'linear-gradient(135deg,#fcee21,#ff2e97,#00e0ff)';
    if (id === 'y2k')       return 'linear-gradient(135deg,#00e0ff,#aab,#ff00a0)';
    if (id === 'synthwave') return 'linear-gradient(180deg,#2a0a4a,#ff2d95 70%,#ffcf3a)';
    if (id === 'biopunk')   return 'radial-gradient(circle at 35% 35%, #3dffa0, #06120e 80%)';
    if (id === 'kawaii')    return 'linear-gradient(135deg,#a9c7ff,#ffc2e2)';
    if (id === 'solar')     return 'linear-gradient(135deg,#ffd56b,#7bed9f)';
    if (id === 'twitch')    return 'linear-gradient(135deg,#9146ff,#6441a5)';
    if (id === 'wh40k')     return 'linear-gradient(135deg,#0a1c44,#1f3f86 55%,#f5c542)';
    if (id === 'code')      return 'radial-gradient(circle at 35% 30%, #39ff7a, #001a05 80%)';
    return (THEMES[id] && THEMES[id].accent) || '#888';
  }
  if (id === 'rainbow') return 'conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)';
  if (cat === 'trail'){
    switch(id){
      case 'fire':   return 'linear-gradient(135deg,#ffce3a,#ff5722)';
      case 'ice':    return 'linear-gradient(135deg,#aee9ff,#3aa0ff)';
      case 'neon':   return '#39ffaa';
      case 'violet': return '#a371f7';
      case 'gold':   return '#ffcd46';
      default:       return TH().accent;      // classic
    }
  }
  return (ORB_COLORS[id] && ORB_COLORS[id][0]) || TH().accent;
}
function renderShop(){
  document.getElementById('shopCoins').textContent = fmt(coins);
  const iap = window.OMS_IAP;
  const iapReady = !!(iap && iap.ready);
  let html = '';
  for (const [cat,label] of [['theme','THEMES'],['trail','TRAILS'],['orb','ORBS']]){
    html += `<div class="cat">${label}</div>`;
    // real-money "Unlock ALL themes" bundle (only when StoreKit is available and not everything's owned)
    if (cat === 'theme' && iapReady){
      const bundle = COSMETICS.theme.filter(t => t.premium && !t.ultra);   // ultra (Prism) is NOT in the bundle
      if (!bundle.every(t => owned.theme.includes(t.id))){
        const price = iap.priceForAll();
        if (price) html += `<div class="unlockall"><span class="sw" style="background:linear-gradient(135deg,#8957e5,#58a6ff)">✨</span>`
              + `<span class="nm">Unlock ALL themes</span><button data-act="iapall">${price}</button></div>`;
      }
    }
    for (const it of COSMETICS[cat]){
      const isOwned = owned[cat].includes(it.id);
      const isEq    = cat === 'theme' ? themeName === it.id : equipped[cat] === it.id;
      let btns;
      if (isEq)          btns = `<button class="equipped" disabled>Equipped</button>`;
      else if (isOwned)  btns = `<button data-act="equip" data-cat="${cat}" data-id="${it.id}">Equip</button>`;
      else if (it.ultra){                                            // ultra (Prism): real-money only, no coin path
        const p = iapReady && iap.priceForTheme(it.id);
        btns = p ? `<button class="iap ultra" data-act="iapbuy" data-id="${it.id}">${p}</button>`
                 : `<button class="iap ultra" disabled>$99.99</button>`;
      }
      else if (it.winUnlock){                                        // earned by wins, not purchasable
        btns = `<button class="winlock" disabled>🏆 ${Math.min(myWins, it.winUnlock)}/${it.winUnlock} wins</button>`;
      }
      else {
        btns = `<button class="buy" data-act="buy" data-cat="${cat}" data-id="${it.id}" ${coins<it.cost?'disabled':''}><span class="ci">C</span>${fmt(it.cost)}</button>`;
        if (cat === 'theme' && it.premium && iapReady){               // real-money alternative to grinding coins
          const p = iap.priceForTheme(it.id);
          if (p) btns += `<button class="iap" data-act="iapbuy" data-id="${it.id}">${p}</button>`;
        }
      }
      // let players preview any theme they don't currently have equipped
      if (cat === 'theme' && !isEq) btns += `<button class="preview" data-act="preview" data-id="${it.id}">Preview</button>`;
      html += `<div class="item"><span class="sw" style="background:${swatchStyle(cat,it.id)}">${it.emoji||''}</span>`
            + `<span class="nm">${it.name}</span><span class="btns">${btns}</span></div>`;
      if (it.ultra || it.winUnlock) html += `<div class="exnote">Not included in the Unlock All bundle</div>`;
    }
  }
  if (iapReady) html += `<button class="restore" data-act="restore">Restore purchases</button>`;
  // Ko-fi only on the web — external payment links aren't allowed in the App Store build
  if (!window.Capacitor) html += `<a class="kofi" href="https://ko-fi.com/natemakesstuff" target="_blank" rel="noopener">☕ Support development on Ko-fi</a>`;
  const body = document.getElementById('shopBody');
  body.innerHTML = html;
  body.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const { act, cat, id } = b.dataset;
    if (act === 'buy') buyItem(cat, id);
    else if (act === 'equip') equipItem(cat, id);
    else if (act === 'preview') startPreview(id);
    else if (act === 'iapbuy'){ armPurchaseIntent(); iap.buyTheme(id); }
    else if (act === 'iapall'){ armPurchaseIntent(); iap.buyAll(); }
    else if (act === 'restore') iap.restore();
  }));
}

// ---------- purchase celebration (confetti + "Unlocked!" toast) ----------
let purchaseIntent = false, piTimer = 0;   // set on a deliberate IAP tap so restores/launch don't spray confetti
function armPurchaseIntent(){ purchaseIntent = true; clearTimeout(piTimer); piTimer = setTimeout(() => { purchaseIntent = false; }, 90000); }   // auto-disarm if the buy is cancelled
function celebratePurchase(label){
  sfxPurchase();
  const toast = document.getElementById('fxToast');
  if (toast){ toast.textContent = `✓ ${label} unlocked!`; toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show'); }
  const fx = document.getElementById('fx'); if (!fx) return;
  const colors = ['#58a6ff','#ffd95e','#3fb950','#f85149','#a371f7','#ff7b72','#39d0d8'];
  const cx = innerWidth/2, cy = innerHeight*0.42;
  for (let i = 0; i < 56; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti';
    piece.style.background = colors[i % colors.length];
    if (i % 3 === 0) piece.style.borderRadius = '50%';
    fx.appendChild(piece);
    const ang = Math.random() * Math.PI * 2;
    const vel = 130 + Math.random() * 280;
    const dx = Math.cos(ang) * vel;
    const dy = Math.sin(ang) * vel - (160 + Math.random() * 140);   // bias the initial pop upward
    const rot = Math.random() * 900 - 450;
    const dur = 1000 + Math.random() * 800;
    piece.animate([
      { transform:`translate(${cx}px,${cy}px) rotate(0deg)`, opacity:1, offset:0 },
      { transform:`translate(${cx+dx*0.6}px,${cy+dy}px) rotate(${rot*0.5}deg)`, opacity:1, offset:0.35 },
      { transform:`translate(${cx+dx}px,${cy+dy+innerHeight*0.7}px) rotate(${rot}deg)`, opacity:0, offset:1 }
    ], { duration:dur, easing:'cubic-bezier(.2,.6,.35,1)' }).onfinish = () => piece.remove();
  }
}

// For real-money buys, hold the celebration until Apple's success dialog is dismissed.
// StoreKit's alert makes the app resign-active; pressing OK makes it active again.
let appActive = true, pendingCelebration = null;
function flushCelebration(){
  if (!pendingCelebration) return;
  const l = pendingCelebration; pendingCelebration = null;
  setTimeout(() => celebratePurchase(l), 450);   // let Apple's dialog finish dismissing first
}
if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App){
  Capacitor.Plugins.App.addListener('appStateChange', ({ isActive }) => {
    appActive = isActive;
    if (isActive) flushCelebration();   // user pressed OK / dialog dismissed → app active again
  });
}
function celebratePurchaseWhenActive(label){
  // Always queue. On a real device the StoreKit purchase flow makes the app resign-active,
  // so we hold the confetti until it becomes active again (the OK press). If the app never
  // went inactive (already active, or simulator StoreKit test), fire after a short beat.
  pendingCelebration = label;
  if (appActive) setTimeout(flushCelebration, 600);
}

function buyItem(cat, id){
  const it = COSMETICS[cat].find(x => x.id === id);
  if (!it || it.ultra || owned[cat].includes(id) || coins < it.cost) return;   // ultra is real-money only
  coins -= it.cost; owned[cat].push(id);
  if (cat === 'theme'){ themeName = id; syncUI(); } else equipped[cat] = id;
  saveGame(); renderShop();
  celebratePurchase(it.name);
}
function equipItem(cat, id){
  if (!owned[cat].includes(id)) return;
  if (cat === 'theme'){ themeName = id; syncUI(); } else equipped[cat] = id;
  saveGame(); renderShop();
}

// ---------- theme preview ----------
// Closes the shop, applies a theme live (without saving) and freezes the scene so the
// player can see it on the real play/title background, then offers buy/equip/done.
let previewing = null, preTheme = null;
function startPreview(id){
  if (!THEMES[id]) return;
  if (previewing === null) preTheme = themeName;   // remember the real equipped theme
  previewing = id; themeName = id; syncUI();
  closeShop();
  renderPreviewBar(id);
}
function endPreview(keep){
  if (previewing === null) return;
  if (!keep){ themeName = preTheme; syncUI(); }     // revert to the equipped theme
  previewing = null; preTheme = null;
  document.getElementById('previewBar').classList.remove('show');
}
function renderPreviewBar(id){
  const it = COSMETICS.theme.find(t => t.id === id); if (!it) return;
  const iap = window.OMS_IAP, iapReady = !!(iap && iap.ready);
  const isOwned = owned.theme.includes(id);
  let action = '';
  if (isOwned)            action = `<button class="pbuy" data-pact="equip" data-id="${id}">Equip</button>`;
  else if (it.ultra){     const p = iapReady && iap.priceForTheme(id);
                          action = p ? `<button class="piap" data-pact="iapbuy" data-id="${id}">${p}</button>` : ''; }
  else if (it.winUnlock)  action = '';                            // earned, not purchasable
  else {
    if (iapReady && it.premium){ const p = iap.priceForTheme(id); if (p) action += `<button class="piap" data-pact="iapbuy" data-id="${id}">${p}</button>`; }
    action += `<button class="pbuy" data-pact="buy" data-id="${id}" ${coins<it.cost?'disabled':''}><span class="ci">C</span>${fmt(it.cost)}</button>`;
  }
  const bar = document.getElementById('previewBar');
  bar.innerHTML = `<div class="prow"><span class="pl">Previewing <b>${it.name}</b></span>${action}</div><button class="pdone" data-pact="done">Done</button>`;
  bar.querySelectorAll('button[data-pact]').forEach(b => b.addEventListener('click', () => {
    const { pact } = b.dataset, tid = b.dataset.id;
    if (pact === 'done'){ endPreview(false); openShop(); }
    else if (pact === 'equip'){ endPreview(true); equipItem('theme', tid); openShop(); }
    else if (pact === 'buy'){ const had = owned.theme.includes(tid); buyItem('theme', tid); if (owned.theme.includes(tid) && !had) endPreview(true); }
    else if (pact === 'iapbuy'){ armPurchaseIntent(); window.OMS_IAP && window.OMS_IAP.buyTheme(tid); }  // stays in preview; finalized on entitlement
  }));
  bar.classList.add('show');
}

// ---------- in-app purchases bridge (native StoreKit via cordova-plugin-purchase; see iap.js) ----------
const IAP_APP_ID = 'com.captainnate.onemoreswing';
window.OMS_IAP_CONFIG = (() => {
  const premium = COSMETICS.theme.filter(t => t.premium).map(t => t.id);                  // all individually buyable
  const bundle  = COSMETICS.theme.filter(t => t.premium && !t.ultra).map(t => t.id);      // what "unlock all" grants (excludes ultra)
  const themeProducts = {};
  premium.forEach(id => { themeProducts[`${IAP_APP_ID}.theme.${id}`] = id; });   // productId -> theme id
  return { allProduct: `${IAP_APP_ID}.themes.all`, themeProducts, allThemeIds: bundle };
})();
// iap.js calls this when a product becomes owned (fresh purchase OR restore)
window.OMS_applyEntitlement = function(productId){
  const cfg = window.OMS_IAP_CONFIG; let changed = false; let label = null;
  const unlock = id => { if (!owned.theme.includes(id)){ owned.theme.push(id); changed = true; } };
  if (productId === cfg.allProduct){ cfg.allThemeIds.forEach(unlock); label = 'All themes'; }
  else if (cfg.themeProducts[productId]){ const tid = cfg.themeProducts[productId]; unlock(tid);
    const it = COSMETICS.theme.find(t => t.id === tid); label = it ? it.name : null; }
  if (changed){
    // if the player was previewing a theme they just bought via IAP, keep it equipped
    if (previewing && owned.theme.includes(previewing)) endPreview(true);
    saveGame();
    // only celebrate on a deliberate buy (not restore/launch). Clear the flag ONLY here —
    // iap.js calls this for every owned product on refresh, so clearing it unconditionally
    // would consume the intent before the loop reaches the just-purchased theme.
    if (purchaseIntent && label){ purchaseIntent = false; celebratePurchaseWhenActive(label); }
  }
  if (shopOpen) renderShop();
};
// iap.js calls this when store prices load or change
window.OMS_onIapUpdated = function(){ if (shopOpen) renderShop(); };

function lbSign(day, score){ const s=`${day}:${score}:oms_v1`; let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function tagOf(pid){ let h=5381; const s=String(pid); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return String(h % 10000); }  // matches server
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// profanity filter (must match the server's isClean in functions/api/scores.js)
const BANNED = [
  'fuck','shit','bitch','cunt','asshole','bastard','slut','whore','piss','dick',
  'pussy','dildo','jizz','wank','twat','bollock','boner','semen','ejaculat',
  'masturbat','blowjob','handjob','cumshot','cocksuck','cockhead','motherfuck',
  'bullshit','dumbass','jackass','dickhead','nigger','nigga','faggot','retard',
  'rapist','molest','pedo','paedo','nazi','kike','spic','chink','coon','wetback',
  'tranny','dyke','porn','hentai','fellatio','goatse','scrotum'
];
function deleet(s){
  return String(s).toLowerCase()
    .replace(/[\s._\-]+/g,'')
    .replace(/ph/g,'f')
    .replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a')
    .replace(/5/g,'s').replace(/7/g,'t').replace(/8/g,'b').replace(/9/g,'g')
    .replace(/\$/g,'s').replace(/@/g,'a').replace(/\+/g,'t').replace(/!/g,'i')
    .replace(/v/g,'u')
    .replace(/[^a-z]/g,'');
}
function isClean(name){
  const n = deleet(name), c = n.replace(/(.)\1+/g,'$1');
  return !BANNED.some(w => n.includes(w) || c.includes(w));
}
async function fetchScores(day){ try{ const r=await fetch(`${API_BASE}/api/scores?day=${day}`); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
async function submitScoreNow(){
  const day = dayNumber, score = Math.floor(lastScore);
  if (score <= 0) return null;
  try{
    const r = await fetch(`${API_BASE}/api/scores`, { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ name: playerName||'anon', score, day, pid: playerId, sig: lbSign(day, score) }) });
    if (!r.ok) return null; return await r.json();
  } catch(e){ return null; }
}
function renderLB(data){
  const hasName = !!(playerName && playerName.trim());
  const showInput = !hasName || editingName;          // ask for a name only the first time (or when editing)
  let html = '';
  if (showInput)
    html += `<input id="lbName" maxlength="16" placeholder="enter a name" value="${escapeHtml(playerName)}" />`;
  html += `<div class="youare">${(hasName && !showInput) ? 'You are' : "You'll appear as"} `
        + `<b>${escapeHtml(playerName||'anon')}<span class="tag">#${tagOf(playerId)}</span></b>`
        + `${(hasName && !showInput) ? ' <a href="#" id="lbEdit" class="editname">edit</a>' : ''}</div>`;
  if (mode==='daily' && lastScore>0 && !submittedRun)
    html += `<button class="submit" id="lbSubmit">Submit my ${fmt(lastScore)}</button>`;
  else if (submittedRun && data && data.rank)
    html += `<div class="msg" style="padding:4px 0 12px">You're #${data.rank} today 🎉</div>`;

  if (!data || !data.scores)
    html += `<div class="msg">Leaderboard offline.<br><span style="font-size:12px">(activates once deployed with the D1 database connected)</span></div>`;
  else if (!data.scores.length)
    html += `<div class="msg">No scores yet today — be the first! 🏆</div>`;
  else {
    const myTag = tagOf(playerId);
    data.scores.forEach((s,i)=>{
      const me = (s.tag === myTag) ? ' me' : '';
      html += `<div class="row${me}"><span class="rk">${i+1}</span><span class="nm">${escapeHtml(s.name)}<span class="tag">#${s.tag||'?'}</span></span><span class="sc">${fmt(s.score)}</span></div>`;
    });
  }
  lbBody.innerHTML = html;

  const inp = document.getElementById('lbName');
  if (inp){ inp.focus(); inp.addEventListener('input', ()=>{ playerName = inp.value.trim().slice(0,16); saveGame(); }); }
  const edit = document.getElementById('lbEdit');
  if (edit) edit.addEventListener('click', e=>{ e.preventDefault(); editingName = true; renderLB(data); });
  const sub = document.getElementById('lbSubmit');
  if (sub) sub.addEventListener('click', async ()=>{
    const nm = (inp ? inp.value.trim().slice(0,16) : playerName) || 'anon';   // locked mode submits the saved name
    if (!isClean(nm)){
      sub.textContent = 'Please pick a cleaner name'; sub.style.background = '#f85149'; sub.style.color = '#fff';
      setTimeout(()=>{ sub.textContent = `Submit my ${fmt(lastScore)}`; sub.style.background = ''; sub.style.color = ''; }, 2000);
      return;
    }
    playerName = nm; editingName = false; saveGame();
    sub.textContent = 'Submitting…'; sub.disabled = true;
    const res = await submitScoreNow();
    submittedRun = !!res;
    renderLB(res);
  });
}

// read the player's win count from the leaderboard and unlock the Minimalist theme at the threshold
function checkWinUnlock(data){
  if (!data || !data.champions) return;
  const me = data.champions.find(c => c.tag === tagOf(playerId));
  myWins = me ? (me.wins || 0) : 0;
  const mono = COSMETICS.theme.find(t => t.id === 'mono');
  if (mono && myWins >= mono.winUnlock && !owned.theme.includes('mono')){
    owned.theme.push('mono'); saveGame();
    if (shopOpen) renderShop();
  }
}
function renderWins(data){
  checkWinUnlock(data);
  const myTag = tagOf(playerId);
  let html = '';
  if (!data || !data.champions)    html += `<div class="msg">Leaderboard offline.</div>`;
  else if (!data.champions.length) html += `<div class="msg">No champions yet — win a daily to be the first! 👑</div>`;
  else data.champions.forEach((c,i)=>{
    const me = (c.tag === myTag) ? ' me' : '';
    html += `<div class="row${me}"><span class="rk">${i+1}</span><span class="nm">${escapeHtml(c.name)}<span class="tag">#${c.tag}</span></span><span class="sc">${c.wins} 🏆</span></div>`;
  });
  lbBody.innerHTML = html;
}

function showGameOverAd(){
  if (!ADS_ENABLED || !ADSENSE_CLIENT || !ADSENSE_SLOT) return;
  const now = Date.now();

  if (gameoverAd.childElementCount && now - lastAdAt < AD_MIN_INTERVAL){ gameoverAd.classList.add('show'); return; }
  lastAdAt = now;
  gameoverAd.innerHTML =
    `<ins class="adsbygoogle" style="display:block" data-ad-client="${ADSENSE_CLIENT}" ` +
    `data-ad-slot="${ADSENSE_SLOT}" data-ad-format="auto" data-full-width-responsive="false"></ins>`;

// solid two-colour split background (top half / bottom half) with a soft same-colour
// glow in each half and a thin divider — used by the comic-inspired themes.
// glow args are "r,g,b" strings (or null to skip that half's glow).
function splitBg(topFill, botFill, topGlow, botGlow){
  const mid = Math.round(H*0.5);
  ctx.fillStyle=topFill; ctx.fillRect(0, 0, W, mid);
  ctx.fillStyle=botFill; ctx.fillRect(0, mid, W, H-mid);
  if (topGlow){ const r=ctx.createRadialGradient(W*0.3,H*0.26,0, W*0.3,H*0.26,H*0.42);
    r.addColorStop(0,`rgba(${topGlow},0.20)`); r.addColorStop(1,`rgba(${topGlow},0)`); ctx.fillStyle=r; ctx.fillRect(0,0,W,mid); }
  if (botGlow){ const r=ctx.createRadialGradient(W*0.7,H*0.74,0, W*0.7,H*0.74,H*0.42);
    r.addColorStop(0,`rgba(${botGlow},0.20)`); r.addColorStop(1,`rgba(${botGlow},0)`); ctx.fillStyle=r; ctx.fillRect(0,mid,W,H-mid); }
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(0, mid-1, W, 2);   // thin divider
}
function drawBackground(){
  if (TH().bg === 'space'){
    ctx.fillStyle = '#05070d'; ctx.fillRect(0,0,W,H);
    let neb = ctx.createRadialGradient(W*0.72,H*0.28,0, W*0.72,H*0.28,H*0.85);
    neb.addColorStop(0,'rgba(52,211,153,0.10)'); neb.addColorStop(1,'rgba(52,211,153,0)');
    ctx.fillStyle = neb; ctx.fillRect(0,0,W,H);
    neb = ctx.createRadialGradient(W*0.2,H*0.78,0, W*0.2,H*0.78,H*0.7);
    neb.addColorStop(0,'rgba(120,90,220,0.08)'); neb.addColorStop(1,'rgba(120,90,220,0)');
    ctx.fillStyle = neb; ctx.fillRect(0,0,W,H);
    if (!stars) makeStars();
    const t = performance.now()/1000;
    ctx.fillStyle = '#dfe8ff';
    for (const s of stars){
      const px = ((s.x*W - cameraX*s.par) % W + W) % W;   // parallax wrap
      ctx.globalAlpha = 0.35 + 0.5*Math.max(0, Math.sin(t*2 + s.ph));
      ctx.beginPath(); ctx.arc(px, s.y*H, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (TH().bg === 'vapor'){
    // vaporwave sunset (dark up top where the HUD sits, neon pink toward the horizon)
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#241046'); g.addColorStop(0.42,'#5b1a8a');
    g.addColorStop(0.6,'#ff6ad5'); g.addColorStop(0.74,'#ff8c6b'); g.addColorStop(1,'#190a2e');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // banded retro sun
    const sunY = H*0.58, sunR = H*0.17;
    ctx.save();
    ctx.beginPath(); ctx.arc(W*0.5, sunY, sunR, 0, Math.PI*2); ctx.clip();
    const sg = ctx.createLinearGradient(0, sunY-sunR, 0, sunY+sunR);
    sg.addColorStop(0,'#fff07a'); sg.addColorStop(1,'#ff5dae');
    ctx.fillStyle = sg; ctx.fillRect(W*0.5-sunR, sunY-sunR, sunR*2, sunR*2);
    ctx.fillStyle = '#190a2e';
    for (let i=0;i<7;i++){ const by = sunY + 2 + i*7; ctx.fillRect(W*0.5-sunR, by, sunR*2, 2+i); }
    ctx.restore();
    // neon perspective grid floor
    const horizon = H*0.66;
    ctx.strokeStyle = 'rgba(45,226,230,0.35)'; ctx.lineWidth = 1;
    for (let i=1;i<=10;i++){ const t=i/10, y=horizon+(H-horizon)*t*t;
      ctx.globalAlpha = 0.45*(1-t)+0.1; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const vp = W*0.5, off = (cameraX*0.25) % 70;
    for (let i=-14;i<=14;i++){ const x = vp + i*70 - off;
      ctx.beginPath(); ctx.moveTo(vp, horizon); ctx.lineTo(vp + (x-vp)*4, H); ctx.stroke(); }
  } else if (TH().bg === 'unicorn'){
    // dreamy pink/purple with rainbow sparkles
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1f0b22'); g.addColorStop(1,'#2c0f30');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    let r = ctx.createRadialGradient(W*0.3,H*0.3,0, W*0.3,H*0.3,H*0.75);
    r.addColorStop(0,'rgba(255,120,200,0.16)'); r.addColorStop(1,'rgba(255,120,200,0)');
    ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    r = ctx.createRadialGradient(W*0.76,H*0.62,0, W*0.76,H*0.62,H*0.65);
    r.addColorStop(0,'rgba(150,120,255,0.14)'); r.addColorStop(1,'rgba(150,120,255,0)');
    ctx.fillStyle=r; ctx.fillRect(0,0,W,H);

      const a = 0.35 + 0.5*Math.max(0, Math.sin(t*2 + s.ph)), rr = s.r*1.8;
      ctx.globalAlpha = a; ctx.fillStyle = `hsl(${(s.ph*57 + t*18)%360},100%,80%)`;
      ctx.beginPath();                                   // 4-point sparkle
      ctx.moveTo(px,py-rr); ctx.lineTo(px+rr*0.28,py); ctx.lineTo(px,py+rr); ctx.lineTo(px-rr*0.28,py); ctx.closePath();
      ctx.moveTo(px-rr,py); ctx.lineTo(px,py+rr*0.28); ctx.lineTo(px+rr,py); ctx.lineTo(px,py-rr*0.28); ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (TH().bg === 'cyber'){
    // neon-noir cityscape
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0a18'); g.addColorStop(0.55,'#1a0e2e'); g.addColorStop(1,'#06060f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    const baseY=H*0.74, tile=120, off=((cameraX*0.3)%tile+tile)%tile, n0=Math.floor((cameraX*0.3)/tile);

      for(let wx=bx+6; wx<bx+tile-24; wx+=14, col++){ let row=0;
        for(let wy=baseY-bh+10; wy<baseY-8; wy+=15, row++){ if(((seed*31+col*7+row*13)%5)<2) ctx.fillRect(wx,wy,4,6); } }
    }
  } else if (TH().bg === 'y2k'){
    // digital glitch / chrome
    ctx.fillStyle='#0b0f1a'; ctx.fillRect(0,0,W,H);

    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.03)';
    for(let y=0;y<H;y+=4) ctx.fillRect(0,y,W,1);
    const t=performance.now();
    for(let i=0;i<8;i++){
      const seed=Math.floor(t/110)+i*53, gx=(seed*131)%W, gy=(seed*197)%H, gw=20+((seed*7)%170), gh=4+((seed*3)%16);
      ctx.fillStyle=['rgba(0,224,255,0.18)','rgba(255,0,160,0.18)','rgba(57,255,20,0.14)'][seed%3];
      ctx.fillRect(gx,gy,gw,gh);

    }
  } else if (TH().bg === 'synthwave'){

    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

      ctx.globalAlpha=0.35+0.4*Math.max(0,Math.sin(t*2+s.ph)); ctx.beginPath(); ctx.arc(px,s.y*H*0.9,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    const horizon=H*0.62;
    ctx.strokeStyle='#ffcf3a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(W*0.5,horizon,H*0.15,Math.PI,0); ctx.stroke();
    ctx.strokeStyle='rgba(255,45,149,0.5)'; ctx.lineWidth=1;

    ctx.globalAlpha=1;
    const vp=W*0.5, off=(cameraX*0.3)%60;
    for(let i=-16;i<=16;i++){ const x=vp+i*60-off; ctx.beginPath(); ctx.moveTo(vp,horizon); ctx.lineTo(vp+(x-vp)*4,H); ctx.stroke(); }
  } else if (TH().bg === 'biopunk'){

    g.addColorStop(0,'#04120c'); g.addColorStop(1,'#08160f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    let r=ctx.createRadialGradient(W*0.3,H*0.6,0,W*0.3,H*0.6,H*0.7);

    g.addColorStop(0,'#2b2750'); g.addColorStop(1,'#4a2f55');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    let r=ctx.createRadialGradient(W*0.3,H*0.35,0,W*0.3,H*0.35,H*0.7);
    r.addColorStop(0,'rgba(169,199,255,0.12)'); r.addColorStop(1,'rgba(169,199,255,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    r=ctx.createRadialGradient(W*0.7,H*0.6,0,W*0.7,H*0.6,H*0.6);
    r.addColorStop(0,'rgba(255,180,220,0.12)'); r.addColorStop(1,'rgba(255,180,220,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    const t=performance.now()/1000;
    ctx.fillStyle='rgba(255,225,245,0.09)';
    for(let i=0;i<5;i++){
      const cx=((i*240 - cameraX*0.15 - t*6)%(W+220)+(W+220))%(W+220)-110, cy=H*(0.18+0.14*i)+Math.sin(t*0.4+i)*6;
      ctx.beginPath(); ctx.ellipse(cx,cy,46,20,0,0,Math.PI*2); ctx.ellipse(cx+28,cy+4,32,16,0,0,Math.PI*2); ctx.ellipse(cx-28,cy+4,30,15,0,0,Math.PI*2); ctx.fill();
    }
    if(!stars) makeStars();
    for(const s of stars){ if(s.x>0.6) continue; const px=((s.x*W - cameraX*s.par)%W+W)%W;
      ctx.globalAlpha=0.3+0.4*Math.max(0,Math.sin(t*1.5+s.ph)); ctx.fillStyle=s.ph>3?'#ffc2e2':'#bcd3ff';
      ctx.beginPath(); ctx.arc(px,s.y*H,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  } else if (TH().bg === 'solar'){
    // hopeful eco-future
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#16321f'); g.addColorStop(0.6,'#1d3a22'); g.addColorStop(1,'#0e2417');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    let r=ctx.createRadialGradient(W*0.6,H*0.2,0,W*0.6,H*0.2,H*0.85);
    r.addColorStop(0,'rgba(255,213,107,0.16)'); r.addColorStop(1,'rgba(255,213,107,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    r=ctx.createRadialGradient(W*0.2,H*0.7,0,W*0.2,H*0.7,H*0.6);
    r.addColorStop(0,'rgba(120,230,140,0.10)'); r.addColorStop(1,'rgba(120,230,140,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    if(!stars) makeStars();
    const t=performance.now()/1000; ctx.fillStyle='#ffe9a8';
    for(const s of stars){ const px=((s.x*W - cameraX*s.par - t*5*s.par)%W+W)%W, py=s.y*H+Math.sin(t*0.4+s.ph)*10;
      ctx.globalAlpha=0.22+0.4*Math.max(0,Math.sin(t+s.ph)); ctx.beginPath(); ctx.arc(px,py,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(8,28,17,0.9)';
    const base=H*0.93, lt=90, loff=((cameraX*0.25)%lt+lt)%lt;
    for(let i=-1;i<W/lt+2;i++){ const lx=i*lt-loff; ctx.beginPath(); ctx.moveTo(lx,H); ctx.quadraticCurveTo(lx+lt*0.3, base-26, lx+lt*0.5, base); ctx.quadraticCurveTo(lx+lt*0.7, base-26, lx+lt, H); ctx.fill(); }
  } else if (TH().bg === 'twitch'){
    // stream purple with drifting chat-emote spam
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#160d28'); g.addColorStop(1,'#0e0a18');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    let r=ctx.createRadialGradient(W*0.3,H*0.3,0,W*0.3,H*0.3,H*0.7);
    r.addColorStop(0,'rgba(145,70,255,0.16)'); r.addColorStop(1,'rgba(145,70,255,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    r=ctx.createRadialGradient(W*0.75,H*0.65,0,W*0.75,H*0.65,H*0.6);
    r.addColorStop(0,'rgba(188,120,255,0.10)'); r.addColorStop(1,'rgba(188,120,255,0)'); ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
    if (!emotes) makeEmotes();
    const t = performance.now()/1000;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for (const e of emotes){
      const yy = ((e.y - t*e.spd*0.05) % 1 + 1) % 1;       // float upward, wrap
      const px = e.x*W + Math.sin(t*0.5 + e.ph)*14;
      let a = 0.5;
      if (yy < 0.15) a *= yy/0.15;                         // fade out near top
      if (yy > 0.9)  a *= (1-yy)/0.1;                       // fade in near bottom
      ctx.globalAlpha = a; ctx.font = `${e.size}px sans-serif`;
      ctx.fillText(e.ch, px, yy*H);
    }
    ctx.globalAlpha=1; ctx.textBaseline='alphabetic';
  } else if (TH().bg === 'bman' || TH().bg === 'black'){ ctx.fillStyle='#070708'; ctx.fillRect(0,0,W,H);  // solid black (accent pops): Bman/DV/LS
  } else if (TH().bg === 'prism'){
    const h = prismHue();                                   // ever-shifting full-spectrum backdrop
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,   `hsl(${h},70%,12%)`);
    g.addColorStop(0.5, `hsl(${(h+90)%360},65%,9%)`);
    g.addColorStop(1,   `hsl(${(h+180)%360},70%,12%)`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const r = ctx.createRadialGradient(W*0.5,H*0.42,0, W*0.5,H*0.42,H*0.7);
    r.addColorStop(0, `hsla(${h},95%,60%,0.18)`); r.addColorStop(1, `hsla(${h},95%,60%,0)`);
    ctx.fillStyle=r; ctx.fillRect(0,0,W,H);
  } else if (TH().bg === 'sman'){   splitBg('#3a0a14', '#0a1a4d', '238,59,59',   '59,109,255');  // red / blue
  } else if (TH().bg === 'joker'){  splitBg('#0a2a18', '#18092c', '115,255,94',  '150,60,255');  // green / purple
  } else if (TH().bg === 'harley'){
    // light blue (top) → whitish-blonde/cream (middle) → light pink (bottom) — the cream
    // break also stops the blue↔pink blend from going purple
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#3f6fc8'); g.addColorStop(0.5,'#f6f2e6'); g.addColorStop(1,'#c85f97');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  } else if (TH().bg === 'wh40k'){
    ctx.fillStyle = '#0e2147'; ctx.fillRect(0,0,W,H);   // solid deep ultramarine navy (Vanguard)
  } else if (TH().bg === 'code'){
    // black with falling, shifting green digits (Datastream)
    ctx.fillStyle='#000700'; ctx.fillRect(0,0,W,H);
    if (!codeRain) makeCodeRain();
    const t = performance.now()/1000, cell = 18, tail = 16, rows = Math.ceil(H/cell)+tail;
    ctx.font = '14px ui-monospace, SFMono-Regular, Menlo, monospace'; ctx.textAlign='center';
    for (const col of codeRain){
      const x = col.xf*W, head = (t*col.spd + col.ph*rows) % rows;
      for (let k=0;k<tail;k++){
        const row = Math.floor(head) - k; if (row < 0) continue;
        const y = row*cell + 14; if (y > H+cell) continue;
        const a = k===0 ? 1 : Math.max(0, 1 - k/tail);
        const d = (Math.floor(t*9 + col.xf*53 + row*7)) % 10;   // digit shifts over time
        ctx.fillStyle = k===0 ? `rgba(215,255,215,${a})` : `rgba(45,255,95,${a*0.8})`;
        ctx.fillText(d, x, y);
      }
    }
    ctx.textAlign='left';
  } else {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0d1117'); g.addColorStop(1,'#161b22');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
}

function draw(){
  drawBackground();
  if (titleOpen){ return; }   // title screen shows only the equipped theme's background (overlay is transparent)

  const target = (state==='flying' || state==='landed') ? pickTarget() : null;
  const deathY = H*K.DEATH_FRAC;
  const wLeft  = camX - (W*K.CAM_X_ANCHOR)/zoom - 60;
  const wRight = camX + (W*(1-K.CAM_X_ANCHOR))/zoom + 60;

  // ===== WORLD (camera zoom + screen shake) =====
  ctx.save();
  ctx.translate(W*K.CAM_X_ANCHOR + shakeX, H*0.5 + shakeY);
  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -H*0.5);

  // death zone
  ctx.fillStyle = 'rgba(248,81,73,0.09)';
  ctx.fillRect(wLeft, deathY, wRight-wLeft, H);
  ctx.strokeStyle = 'rgba(248,81,73,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(wLeft,deathY); ctx.lineTo(wRight,deathY); ctx.stroke();

  // safe bank platforms (rounded, flat green) and the gold finish pad (glowing + top edge)
  for (const pl of platforms){
    if (pl.x > wRight || pl.x + pl.w < wLeft) continue;
    const isFinish = !!pl.finish;
    ctx.save();
    if (isFinish){
      ctx.shadowColor = '#ffd95e'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#e3b341';
      ctx.beginPath(); ctx.roundRect(pl.x, pl.y, pl.w, 12, 4); ctx.fill();
      ctx.beginPath(); ctx.roundRect(pl.x, pl.y, pl.w, 12, 4); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,240,170,0.65)';
      ctx.beginPath(); ctx.roundRect(pl.x, pl.y, pl.w, 3.5, 2); ctx.fill();
    } else {
      ctx.fillStyle = '#238636';                            // flat green bank bar, no glow
      ctx.beginPath(); ctx.roundRect(pl.x, pl.y, pl.w, 12, 4); ctx.fill();
    }
    ctx.restore();
    if (!isFinish){
      ctx.fillStyle = 'rgba(63,185,80,0.95)'; ctx.font = '700 11px ui-sans-serif, system-ui';
      ctx.textAlign = 'center'; ctx.fillText('BANK', pl.x + pl.w/2, pl.y - 7);
    }
  }

  // daily finish line
  if (finishX !== null && finishX > wLeft && finishX < wRight){
    ctx.strokeStyle = '#ffd95e'; ctx.lineWidth = 3; ctx.setLineDash([9,7]);
    ctx.beginPath(); ctx.moveTo(finishX, 46); ctx.lineTo(finishX, deathY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffd95e'; ctx.font = '800 15px ui-sans-serif, system-ui'; ctx.textAlign = 'center';
    ctx.fillText('FINISH', finishX, 38);
  }

  // anchors
  for (const a of anchors){
    if (a.x < wLeft || a.x > wRight) continue;
    const isTarget = a === target;
    ctx.beginPath(); ctx.arc(a.x, a.y, isTarget?9:6, 0, Math.PI*2);
    ctx.fillStyle = a===anchor ? TH().accent
                  : a.got      ? '#3b4655'
                  : a.launch   ? '#3fb950'   // relaunch peg above a platform
                  : '#7d8590';
    ctx.fill();
    if (isTarget){
      ctx.beginPath(); ctx.arc(a.x, a.y, 15, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${TH().rgb},0.7)`; ctx.lineWidth = 2; ctx.stroke();
    }
    if (debug){
      ctx.beginPath(); ctx.arc(a.x, a.y, K.GRAPPLE_RANGE, 0, Math.PI*2);
      ctx.strokeStyle='rgba(125,133,144,0.06)'; ctx.lineWidth=1; ctx.stroke();
    }
  }

  // target preview line
  if (target){
    ctx.setLineDash([4,6]); ctx.strokeStyle=`rgba(${TH().rgb},0.5)`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(target.x,target.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // rope
  if (state==='swinging' && anchor){
    ctx.strokeStyle='#8b949e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(anchor.x,anchor.y); ctx.lineTo(p.x,p.y); ctx.stroke();
  }

  // trail (equipped style)
  for (let i=0;i<trail.length;i++){
    const t = trail[i], al = i/trail.length;
    ctx.beginPath(); ctx.arc(t.x, t.y, 2 + al*7, 0, Math.PI*2);
    ctx.fillStyle = trailColor(al, al*0.30); ctx.fill();
  }

  // particles (grab / bank / death bursts)
  for (const q of particles){
    ctx.globalAlpha = Math.max(0, q.life);
    ctx.beginPath(); ctx.arc(q.x, q.y, 1 + q.life*4, 0, Math.PI*2);
    ctx.fillStyle = q.color; ctx.fill();
  }
  ctx.globalAlpha = 1;

  // player (equipped orb skin, with glow)
  if (state!=='dead'){
    const [oc, ic] = orbColors();
    ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.arc(p.x, p.y, 17, 0, Math.PI*2);
    ctx.fillStyle = oc; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, Math.PI*2); ctx.fillStyle = oc; ctx.fill();
    if (equipped.orb === 'smiley'){
      ctx.fillStyle = '#1a1206';
      ctx.beginPath(); ctx.arc(p.x-3.6, p.y-3, 1.7, 0, Math.PI*2); ctx.fill();   // eyes
      ctx.beginPath(); ctx.arc(p.x+3.6, p.y-3, 1.7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#1a1206'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';   // smile
      ctx.beginPath(); ctx.arc(p.x, p.y+1, 5, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
    } else if (equipped.orb === 'eye'){
      const vx = p.x - prevP.x, vy = p.y - prevP.y, m = Math.hypot(vx, vy) || 1;
      const ox = (vx/m)*3.4, oy = (vy/m)*3.4;            // pupil glances toward motion
      ctx.fillStyle = '#2f80ed'; ctx.beginPath(); ctx.arc(p.x+ox, p.y+oy, 4.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0b0e14'; ctx.beginPath(); ctx.arc(p.x+ox, p.y+oy, 2.3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x+ox-1.2, p.y+oy-1.2, 1.0, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fillStyle = ic; ctx.fill();
    }
  }

  // debug velocity vector (world)
  if (debug){
    const vx = (p.x-prevP.x)/DT, vy = (p.y-prevP.y)/DT;
    ctx.strokeStyle='#f0883e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+vx*0.12, p.y+vy*0.12); ctx.stroke();
  }

  // floating score popups (world space, so they ride the camera)
  for (let i = popups.length - 1; i >= 0; i--){
    const f = popups[i];
    if (!paused){ f.age++; f.y -= 0.7; }
    const al = Math.max(0, 1 - f.age/95);
    if (al <= 0){ popups.splice(i,1); continue; }
    ctx.globalAlpha = al; ctx.textAlign = 'center'; ctx.fillStyle = f.color;
    ctx.font = `${f.big ? 800 : 600} ${f.big ? 20 : 14}px ui-sans-serif, system-ui`;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  // ===== end WORLD =====

  // escalating "heat" — edge glow intensifies as the multiplier climbs
  const heat = Math.min((mult-1)/10, 1);
  if (heat > 0.02){
    const rg = ctx.createRadialGradient(W/2,H/2, H*0.30, W/2,H/2, H*0.85);
    rg.addColorStop(0, 'rgba(0,0,0,0)');
    rg.addColorStop(1, `rgba(${TH().rgb},${0.22*heat})`);
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  }

  // HUD — banked score (top-left). Compact on phones, fuller on desktop.
  const small = W < 600;
  ctx.save(); ctx.translate(SAFE_LEFT, SAFE_TOP);  // keep clear of notch / Dynamic Island
  ctx.textAlign = 'left';
  if (small){
    ctx.fillStyle = mode==='daily' ? TH().accent : '#8b949e';
    ctx.font = '800 10px ui-sans-serif, system-ui'; ctx.letterSpacing = '1px';
    ctx.fillText(mode==='daily' ? `Day ${dayNumber} · ${fmtTime(runTime)}` : 'Free Play', 14, 21);
    ctx.letterSpacing = '0px';
    ctx.fillStyle = '#e6edf3'; ctx.font = '800 23px ui-sans-serif, system-ui';
    ctx.fillText(fmt(total), 13, 46);
    let yy = 65;
    if (pending > 0){
      ctx.fillStyle = TH().accent; ctx.font = '600 13px ui-sans-serif, system-ui';
      ctx.fillText(`+${fmt(pending)} at risk`, 14, yy); yy += 17;
    }
    ctx.fillStyle = '#ffd95e'; ctx.font = '700 11px ui-sans-serif, system-ui';
    ctx.fillText(`★ High Score  ${fmt(best)}`, 14, yy);
  } else {
    ctx.fillStyle = mode==='daily' ? TH().accent : '#8b949e';
    ctx.font = '800 12px ui-sans-serif, system-ui'; ctx.letterSpacing = '1px';
    ctx.fillText(mode==='daily' ? `Daily · Day ${dayNumber} · ${fmtTime(runTime)}` : 'Free Play', 21, 28);
    ctx.letterSpacing = '0px';
    ctx.fillStyle = '#8b949e'; ctx.font = '11px ui-sans-serif, system-ui';
    ctx.fillText('BANKED', 22, 52);
    ctx.fillStyle = '#e6edf3'; ctx.font = '800 30px ui-sans-serif, system-ui';
    ctx.fillText(fmt(total), 20, 80);
    if (pending > 0){
      ctx.fillStyle = TH().accent; ctx.font = '600 15px ui-sans-serif, system-ui';
      ctx.fillText(`+${fmt(pending)} at risk`, 21, 102);
    }
    ctx.fillStyle = '#6e7681'; ctx.font = '12px ui-sans-serif, system-ui';
    ctx.fillText(`${dist} m  ·  run ${runCount}`, 21, 122);
    ctx.fillStyle = '#ffd95e'; ctx.font = '800 15px ui-sans-serif, system-ui';
    ctx.fillText(`★ High Score  ${fmt(best)}`, 21, 144);
    ctx.fillStyle = '#c9a227'; ctx.font = '600 13px ui-sans-serif, system-ui';
    ctx.fillText(`${fmt(coins)} coins`, 21, 166);
  }
  ctx.restore();

  // daily progress bar (thin, top edge) — shows how far through the route you are.
  // finishX isn't set until the route fully generates near the end, so until then
  // estimate it from the route length so the bar is visible from the very start.
  if (mode === 'daily' && state !== 'finished'){
    const endX = finishX !== null ? finishX
      : 320 + K.DAILY_LENGTH * K.ANCHOR_SPACING + K.MAX_ROPE + 70;
    const prog = Math.max(0, Math.min(1, (p.x - 320) / (endX - 320)));
    ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(0, SAFE_TOP, W, 3);
    ctx.fillStyle = TH().accent; ctx.fillRect(0, SAFE_TOP, W * prog, 3);
  }

  // multiplier — huge & pulsing, glowing hotter with greed
  if (state!=='dead' && state!=='finished'){
    const big = mult > 1;
    const pulse = big ? 1 + 0.05*Math.sin(performance.now()/90) + heat*0.12 : 1;
    ctx.save();
    // phones: float it low, below the bank-pad band (PLATFORM_Y 0.64); desktop: keep it up top under the HUD
    const multY = small ? H * 0.84 : SAFE_TOP + 100;
    ctx.translate(W/2, multY); ctx.scale(pulse, pulse);
    ctx.textAlign='center';
    ctx.font = `800 ${24 + Math.min((mult-1)*9, 36)}px ui-sans-serif, system-ui`;
    ctx.fillStyle = big ? TH().accent : '#6e7681';
    if (big){ ctx.shadowColor = TH().accent; ctx.shadowBlur = 8 + 22*heat; }
    ctx.fillText(`×${mult.toFixed(1)}`, 0, 0);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  // debug overlay (text; the velocity vector is drawn in the world layer)
  if (debug){
    const vx = (p.x-prevP.x)/DT, vy = (p.y-prevP.y)/DT;
    ctx.fillStyle='#f0883e'; ctx.font='12px monospace'; ctx.textAlign='left';
    ctx.fillText(`|v|=${Math.hypot(vx,vy)|0}  zoom=${zoom.toFixed(2)}  state=${state}  parts=${particles.length}`, 20, H-20);
  }

  // death overlay
  if (state==='dead'){
    ctx.fillStyle='rgba(13,17,23,0.80)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#e6edf3'; ctx.font='700 34px ui-sans-serif, system-ui';
    ctx.fillText('Run over', W/2, H/2 - 100);
    ctx.fillStyle='#8b949e'; ctx.font='600 13px ui-sans-serif, system-ui'; ctx.letterSpacing = '2px';
    ctx.fillText('SCORE', W/2, H/2 - 52);
    ctx.letterSpacing = '0px';
    ctx.fillStyle='#e6edf3'; ctx.font='800 52px ui-sans-serif, system-ui';
    ctx.fillText(fmt(total), W/2, H/2 + 8);
    if (pending > 0){
      ctx.fillStyle='#f85149'; ctx.font='600 17px ui-sans-serif, system-ui';
      ctx.fillText(`${fmt(pending)} unbanked — should've banked!`, W/2, H/2 + 48);
    }
    ctx.fillStyle=TH().accent; ctx.font='600 16px ui-sans-serif, system-ui';
    ctx.fillText('Tap to swing again', W/2, H/2 + 94);
  }

  // daily finish overlay
  if (state==='finished'){
    ctx.fillStyle='rgba(13,17,23,0.82)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=TH().accent; ctx.font='800 22px ui-sans-serif, system-ui'; ctx.letterSpacing='1px';
    ctx.fillText('Daily Complete', W/2, H/2 - 100); ctx.letterSpacing='0px';
    ctx.fillStyle='#8b949e'; ctx.font='600 13px ui-sans-serif, system-ui'; ctx.letterSpacing='2px';
    ctx.fillText(`DAY ${dayNumber} · SCORE`, W/2, H/2 - 52); ctx.letterSpacing='0px';
    ctx.fillStyle='#e6edf3'; ctx.font='800 52px ui-sans-serif, system-ui';
    ctx.fillText(fmt(total), W/2, H/2 + 8);
    ctx.fillStyle='#8b949e'; ctx.font='600 14px ui-sans-serif, system-ui';
    ctx.fillText(`Finished in ${fmtTime(finishTime)}   ·   +${fmt(finishBonus)} time bonus`, W/2, H/2 + 44);
    ctx.fillStyle=TH().accent; ctx.font='600 16px ui-sans-serif, system-ui';
    ctx.fillText('Tap to swing again', W/2, H/2 + 94);
  }

  // pause overlay
  if (paused && state!=='dead' && state!=='finished'){
    ctx.fillStyle='rgba(13,17,23,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#e6edf3';
    ctx.font='700 38px ui-sans-serif, system-ui';
    ctx.fillText('Paused', W/2, H/2 - 28);
  }
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now){
  let ft = (now-last)/1000; last = now;
  if (!paused && !shopOpen && !lbOpen && !titleOpen && !infoOpen && !previewing){
    let timeScale = 1;
    if      (freezeFrames > 0){ freezeFrames--; timeScale = 0;   }  // hit-pause: full freeze
    else if (slowmoFrames > 0){ slowmoFrames--; timeScale = 0.4; }  // clutch slow-mo
    ft = Math.min(ft, 0.25); acc += ft * timeScale;
    let steps = 0;
    while (acc >= DT && steps < 5){ physics(); acc -= DT; steps++; }
    updateCamera();
  } else {
    acc = 0;   // don't fast-forward simulation on resume
  }
  if (themeName === 'prism') document.documentElement.style.setProperty('--accent', TH().accent);  // shift DOM accent live
  draw();
  requestAnimationFrame(frame);
}
loadGame();
mergeCloudSave();   // async: pulls cloud save from iCloud KV; updates coins/owned/equipped then re-syncs
newRun();
syncUI();
fetchWins().then(checkWinUnlock).catch(()=>{});   // unlock Minimalist if already at 100 wins, even without opening the leaderboard
ensureDailyReminder();   // keep the daily-run reminder scheduled (only if already permitted)
requestAnimationFrame(frame);
</script>
